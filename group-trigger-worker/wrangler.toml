# This Worker is inert until deployed and connected to a receiving Telegram bot.
# It does not modify the existing Oracle VM or any GitHub schedule.
name = "muse-telegram-group-trigger"
main = "index.mjs"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# Exact group ID already verified in state/telegram_group_chat.json.
MUSE_GROUP_CHAT_ID = "-5254258160"
# Sender identity verified via read-only Telegram getMe: @mokchamji_hotdeal_bot
# Only messages posted by this bot in the MUSE group can trigger an Action.
SOURCE_SENDER_BOT_ID = "9233582187"

[[queues.producers]]
binding = "EVENT_QUEUE"
queue = "muse-telegram-github-dispatch"

[[queues.consumers]]
queue = "muse-telegram-github-dispatch"
max_batch_size = 20
max_batch_timeout = 20
max_retries = 20
max_concurrency = 1
retry_delay = 180
