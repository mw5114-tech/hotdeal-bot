name: DIAG read-only | Naver public product price HTML

on:
  push:
    branches: [fix/naver-product-price-fallback-20261104]
    paths:
      - '.github/workflows/diag-naver-product-price-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  naver-price-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet playwright==1.64.1
          python -m playwright install --with-deps chromium >/dev/null 2>&1
      - name: Only GET public Naver search and inspect visible product-price cards
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse, urllib.error
          from playwright.sync_api import sync_playwright
          title="삼성전자 4K UHD QLED TV, 214cm(85인치), KQ85QF6AAFXKR"
          urls=[
            "https://m.search.naver.com/search.naver?"+urllib.parse.urlencode({"where":"m_shp","query":title}),
            "https://m.search.naver.com/search.naver?"+urllib.parse.urlencode({"query":title}),
            "https://search.shopping.naver.com/search/all?"+urllib.parse.urlencode({"query":title}),
            "https://m.shopping.naver.com/search/all?"+urllib.parse.urlencode({"query":title}),
          ]
          headers={"User-Agent":"Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 Chrome/129.0 Mobile Safari/537.36","Accept-Language":"ko-KR,ko;q=0.9"}
          for u in urls:
            try:
              with urllib.request.urlopen(urllib.request.Request(u,headers=headers),timeout=12) as r:
                txt=r.read(300000).decode("utf-8","replace")
                nearby=re.findall(r".{0,80}\d{1,3}(?:,\d{3})+\s*원.{0,65}",txt)
                print("HTTP",urllib.parse.urlparse(u).netloc,urllib.parse.parse_qs(urllib.parse.urlparse(u).query).get("where","default"),"status",r.status,"url",r.url[:120],"size",len(txt),"price_mentions",len(nearby),"sample",[(s[:110]) for s in nearby[:2]])
            except Exception as e:
              print("HTTP_ERROR",urllib.parse.urlparse(u).netloc,type(e).__name__,str(e)[:160])
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            try:
              page=browser.new_page(locale="ko-KR",viewport={"width":1300,"height":950})
              for u in urls[:3]:
                try:
                  resp=page.goto(u,wait_until="domcontentloaded",timeout=16000)
                  page.wait_for_timeout(2000)
                  data=page.evaluate("""() => {
                    let priceTexts=[...document.querySelectorAll('a, span, strong, em')]
                      .filter(x => /^\s*\d{1,3}(?:,\d{3})+\s*원?\s*$/.test(x.innerText||''))
                      .slice(0,7).map(x=>({tag:x.tagName,cls:String(x.className).slice(0,100),text:(x.innerText||'').slice(0,45),parent:(x.parentElement?.innerText||'').slice(0,100),ancestor:(x.parentElement?.parentElement?.innerText||'').slice(0,170)}));
                    let shoppingLinks=[...document.querySelectorAll('a[href]')].filter(x=>/smartstore.naver.com|shopping.naver.com|cr.shopping.naver.com/.test(x.href)).slice(0,4).map(x=>({txt:(x.innerText||'').slice(0,100),cls:String(x.className).slice(0,90),url:x.href.slice(0,100)}));
                    return {url:location.href,body:(document.body?.innerText||'').slice(0,1000),priceTexts,shoppingLinks};
                  }""")
                  print("BROWSER",urllib.parse.urlparse(u).netloc,urllib.parse.parse_qs(urllib.parse.urlparse(u).query).get("where","default"),"status",resp.status if resp else None,"data",str(data)[:4500])
                except Exception as e:
                  print("BROWSER_ERROR",urllib.parse.urlparse(u).netloc,type(e).__name__,str(e)[:190])
            finally: browser.close()
          PY
