name: Jirum photo and text -> own Partners link one-shot bridge (guarded)
on:
  push:
    branches: [test/github-only-pipeline-20261031]
    paths: ['.github/workflows/partners-bridge-one-shot.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jirum-one-shot-partners-bridge
  cancel-in-progress: false

jobs:
  github-prepare-draft:
    # User must explicitly enable; no cron and no automatic posting.
    if: vars.GH_ONLY_PARTNERS_BRIDGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAKAO_DEV_STORAGE_STATE_JSON: ${{ secrets.KAKAO_DEV_STORAGE_STATE_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install normal browser for Kakao OG metadata only
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Select one verified Coupang draft from recent public Jirum messages
        run: python -m gh_only.default_deal_automation --max-source-posts 8 --output-dir default-deal-drafts
      - name: Make exact product request; no Partners login or link generation on GitHub cloud
        run: |
          python -m gh_only.partners_draft_handoff --input default-deal-drafts/drafts.json --output partners-link-request.json
      - uses: actions/upload-artifact@v4
        with:
          name: private-jirum-photo-caption-and-partner-request
          path: |
            default-deal-drafts/
            partners-link-request.json
          retention-days: 3

  optional-self-hosted-personal-link:
    needs: github-prepare-draft
    # No real account action until user has verified and connected a trusted
    # persistent runner, enabled 3 explicit variables, and manually dispatched.
    if: github.event_name == 'workflow_dispatch' && vars.GH_ONLY_PARTNERS_BRIDGE_ENABLED == 'true' && vars.GH_ONLY_PARTNERS_SELFHOSTED_ENABLED == 'true' && vars.GH_ONLY_PARTNERS_GENERATE_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, coupang-partners]
    timeout-minutes: 6
    env:
      PARTNERS_PROFILE_DIR: ${{ vars.PARTNERS_PROFILE_DIR }}
      GH_ONLY_PARTNERS_GENERATE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: private-jirum-photo-caption-and-partner-request
          path: .
      - name: Link one exact-product URL using already authorized Chrome profile
        run: xvfb-run -a python3 -m gh_only.partners_persistent_worker --mode generate-one --request-file partners-link-request.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-one-personal-link-result
          path: partners_worker_result.json
          if-no-files-found: warn
          retention-days: 2

# Does not schedule or auto-post anything. Requires separate trusted runner.
