name: Resolve one Coupang source link for research
on:
  pull_request:
    paths:
      - research_resolve_one_source_link.py
      - .github/workflows/one-link-resolve.yml
permissions:
  contents: read
jobs:
  resolve-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect HTTP redirects only, without login or conversion
        run: python research_resolve_one_source_link.py
