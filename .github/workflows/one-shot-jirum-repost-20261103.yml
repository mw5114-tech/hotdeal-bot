name: TEST once | Repost latest published Jirum deal to Daangn

on:
  push:
    branches:
      - main
    paths:
      - 'manual/trigger-repost-latest-20261103.txt'

permissions:
  contents: write

# Same lock as normal publisher.
concurrency:
  group: daangn-jirum-manual-fifo
  cancel-in-progress: false

jobs:
  publish-latest-again-once:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_STATE_TOKEN: ${{ github.token }}
      COUPANG_PARTNER_LPTAG: AF9668915
      JIRUM_IMAGE_SOURCE: lowchart
      JIRUM_REQUIRE_FRESH_POST: 'true'
      JIRUM_REQUIRE_OFFICIAL_PARTNERS_LINK: 'false'
      JIRUM_PUBLISH_BEFORE_MUSE_REWRITE: 'false'
      DAANGN_CAFE_STORAGE_STATE_JSON: ${{ secrets.DAANGN_CAFE_STORAGE_STATE_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install required browser
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Repost latest source once; leave original FIFO history intact
        run: python -m gh_only.one_shot_test_repost
      - name: Upload redacted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-shot-jirum-repost-${{ github.run_id }}
          path: jirum-manual-one-draft/
          retention-days: 1
          if-no-files-found: ignore
