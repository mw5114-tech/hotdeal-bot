name: TEST read-only | ordered provider photo download
on:
  push:
    branches: [fix/ordered-lowchart-couspi-dangapick-20261104]
    paths: ['.github/workflows/test-provider-photo-html-20261104.yml']
permissions:
  contents: read
jobs:
  verify-real-product-photo-without-post:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch public image only; inspect signature and provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from gh_only.ordered_product_photos import ordered_external_photo
          identity={"status":"EXACT_ITEM_IDENTIFIED",
                    "product_id":"8522680027",
                    "item_id":"24674417324","vendor_item_id":None}
          with TemporaryDirectory() as tmp:
              result=ordered_external_photo(
                  identity, "바디인솔 프리미엄 무지 중목 양말 20켤레",
                  Path(tmp), 94975)
              print("PHOTO_READ_ONLY_RESULT", {
                  k: result.get(k) for k in (
                    "status","image_source","image_provider_product_id",
                    "image_provider_item_id","photo_provider_attempts",
                    "saved_name","bytes")})
              if result.get("status")=="IMAGE_SAVED":
                  photo=Path(tmp)/result["saved_name"]
                  print("PHOTO_READ_ONLY_BYTES",photo.is_file(),photo.stat().st_size,
                        photo.read_bytes()[:12].hex())
              assert result.get("status")=="IMAGE_SAVED", "provider fallback failed"
          PY
