name: Jirum item photo via public search index (single read-only attempt)

on:
  push:
    branches: [test/github-only-pipeline-20261031]
    paths:
      - '.github/workflows/jirum-indexed-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-image-index-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline source-ID matching checks first
        run: python -m unittest -v gh_only.test_indexed_image_probe
      - name: One public indexed-image lookup, no Coupang page visit and no posting
        run: python -m gh_only.indexed_image_probe --output indexed_image_probe_result.json
      - name: Save only test diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-item-public-index-photo-candidates
          path: indexed_image_probe_result.json
          if-no-files-found: warn
          retention-days: 7
