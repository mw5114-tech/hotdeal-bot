name: Coupang Partners opt-in signed-in GitHub session reachability

on:
  push:
    branches: [test/github-only-pipeline-20261031]
    paths:
      - '.github/workflows/partners-authenticated-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-session-filter-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No network, no real sessions, no login
        run: |
          python -m py_compile gh_only/partners_authenticated_access_probe.py
          python -m unittest -v gh_only.test_partners_authenticated_access_probe

  user-authorized-session-restore:
    needs: offline-session-filter-guards
    if: vars.GH_ONLY_PARTNERS_AUTH_TEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      COUPANG_PARTNERS_STORAGE_STATE_JSON: ${{ secrets.COUPANG_PARTNERS_STORAGE_STATE_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ordinary Chromium, no stealth
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Read-only UI access check, do not generate links
        run: python -m gh_only.partners_authenticated_access_probe
      - name: Archive codes only, never cookies or screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partners-signed-in-ui-state-codes-only
          path: partners_authenticated_access_probe.json
          if-no-files-found: warn
          retention-days: 2
