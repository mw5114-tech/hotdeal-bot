name: Coupang Windows Chrome Stable one-shot comparison

on:
  push:
    branches: [test/coupang-product-readonly-20261031]
    paths:
      - .github/workflows/coupang-chrome-stable-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-stable-test:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright binding
        shell: pwsh
        run: python -m pip install --disable-pip-version-check playwright
      - name: One access test using installed Chrome Stable (no login, no retry)
        shell: pwsh
        run: python experimental/coupang_chrome_stable_probe.py
      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupang-windows-chrome-stable-result
          path: coupang_probe_chrome_stable.json
          if-no-files-found: warn
          retention-days: 7
