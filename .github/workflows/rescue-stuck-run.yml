name: Rescue stuck Actions run (one-time)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  force-cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force cancel only the stuck combined alert run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "41100653743"
        run: |
          set -euo pipefail
          TARGET="repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          STATUS="$(gh api "$TARGET" --jq '.status')"
          echo "Target run ${RUN_ID} status before: ${STATUS}"
          if [ "$STATUS" = "completed" ]; then
            echo "Target already completed; nothing to cancel."
            exit 0
          fi
          gh api -X POST "$TARGET/force-cancel"
          echo "Force-cancel request sent for target ${RUN_ID} only."
          echo "Check target run status in GitHub Actions; API acceptance is not completion."
