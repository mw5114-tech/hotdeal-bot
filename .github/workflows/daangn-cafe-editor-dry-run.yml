name: Daangn Cafe session editor photo-price draft (manual, NO PUBLISH)

on:
  pull_request:
    paths:
      - 'gh_only/daangn_editor_probe.py'
      - 'gh_only/daangn_public_browser_probe.py'
      - 'gh_only/test_daangn_editor_probe.py'
      - 'tools/daangn_export_session.py'
      - '.github/workflows/daangn-cafe-editor-dry-run.yml'
      - 'docs/DAANGN_CAFE_GITHUB_DRY_RUN.md'
  workflow_dispatch:
    inputs:
      cafe_url:
        description: 'Your own cafe URL, e.g. https://cafe.daangn.com/my-cafe-slug'
        required: true
        type: string
      board_name:
        description: 'Board/category for the draft'
        required: true
        default: '오늘의 핫딜'
        type: string

permissions:
  contents: read

concurrency:
  group: daangn-manual-draft-editor
  cancel-in-progress: false

jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Daangn session and one-draft parsing (no network)
        run: |
          python -m py_compile gh_only/daangn_editor_probe.py tools/daangn_export_session.py
          python -m unittest -v gh_only.test_daangn_editor_probe gh_only.test_affsdp_candidate gh_only.test_default_deal_automation gh_only.test_default_deal_format

  anonymous-public-browser-preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium to verify Github hosted network access to Daangn
        run: |
          python -m pip install --disable-pip-version-check playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Open only public Daangn homepage anonymously
        run: python -m gh_only.daangn_public_browser_probe

  manual-editor:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      KAKAO_DEV_STORAGE_STATE_JSON: ${{ secrets.KAKAO_DEV_STORAGE_STATE_JSON }}
      DAANGN_CAFE_STORAGE_STATE_JSON: ${{ secrets.DAANGN_CAFE_STORAGE_STATE_JSON }}
      COUPANG_PARTNER_LPTAG: AF9668915
      TARGET_CAFE_URL: ${{ inputs.cafe_url }}
      TARGET_BOARD_NAME: ${{ inputs.board_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium (GitHub headless browser)
        run: |
          python -m pip install --disable-pip-version-check playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Generate single recent Jirum photo+price+owner candidate draft
        run: python -m gh_only.default_deal_automation --max-source-posts 8 --output-dir jirum-affsdp-drafts
      - name: Open owner's Daangn Cafe and fill editor WITHOUT publishing
        run: |
          python -m gh_only.daangn_editor_probe \
            --cafe-url "$TARGET_CAFE_URL" \
            --board-name "$TARGET_BOARD_NAME" \
            --drafts-dir jirum-affsdp-drafts \
            --output-dir daangn-editor-probe
      - name: Keep only private temporary browser evidence and photo/caption
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daangn-manual-editor-dry-run
          path: |
            jirum-affsdp-drafts/
            daangn-editor-probe/
          if-no-files-found: warn
          retention-days: 1

# Important: this does NOT enable schedules, submit any post, or touch live bots.
