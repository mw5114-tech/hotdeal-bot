name: Configure Telegram group delivery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/setup-telegram-group.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotdeal-state
  cancel-in-progress: false

jobs:
  configure-group:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check delivery and group discovery code
        run: |
          python -m py_compile telegram_delivery.py telegram_group_setup.py
          python -m unittest -v test_telegram_delivery.py
      - name: Find the existing Hotdeal MUSE group and send test to both destinations
        run: python telegram_group_setup.py
      - name: Save verified group chat ID to private repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/telegram_group_chat.json
          if git diff --cached --quiet; then
            echo "Group ID is already saved."
            exit 0
          fi
          git commit -m "chore: save verified Telegram group chat ID [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Verified group configuration saved."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Could not persist verified Telegram group configuration."
          exit 1
