name: Probe | Jirum public images (READ ONLY)
on:
  push:
    branches: [research/jirum-photo-fallback-20261102]
    paths: ['.github/workflows/probe-jirum-photo-fallback.yml']
permissions:
  contents: read
jobs:
  inspect-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read public Telegram photo/link preview metadata only
        run: |
          python - <<'PY'
          import collections
          import json
          from urllib.parse import urlsplit
          from gh_only.jirum_manual_queue import older_html
          from gh_only.pipeline import enrich_posts
          samples = []
          for before in (94790, 94815, 94835):
              try:
                  rows = enrich_posts(older_html(before), max_posts=200)
              except Exception as exc:
                  print("PUBLIC_TELEGRAM_ERROR " + type(exc).__name__)
                  continue
              matches = [r for r in rows if 94789 <= r['source_message_id'] <= 94834]
              for r in matches:
                  img = r.get('image_url_candidate')
                  samples.append({
                      'id': r['source_message_id'],
                      'image_provenance':r['image_provenance'],
                      'image_host': urlsplit(img).hostname if img else None,
                      'has_image':bool(img),
                      'product_url_kind':r.get('url_kind'),
                  })
          byid = {r['id']:r for r in samples}
          print("PHOTO_FALLBACK_PUBLIC_PROBE " + json.dumps({
              'inspected_posts':len(byid),
              'image_sources': dict(collections.Counter(r['image_provenance'] for r in byid.values())),
              'first_stalled_post': byid.get(94789),
              'recent_samples':[byid.get(mid) for mid in [94790,94791,94800,94810,94820,94830,94834]],
              'posts_published':0,
              'state_changed':False,
          },ensure_ascii=False))
          PY
      - name: Probe exact item Lowchart public page image metadata (NO CAFE POST)
        run: |
          python - <<'PY'
          import collections
          import json
          import re
          from html.parser import HTMLParser
          from urllib import request
          from urllib.parse import urlsplit, urljoin
          from gh_only.shortlink_probe import one_hop
          from gh_only.lowchart_price_reference import build_url
          from pathlib import Path

          source = json.loads(Path("state/daangn_jirum_manual_fifo.json").read_text("utf-8"))["pending"][0]
          identity = one_hop(source["original_purchase_url"])
          id_summary = {k:identity.get(k) for k in ["result","product_id","item_id"]}
          if identity.get("result") != "DIRECT_PRODUCT_ID_CANDIDATE":
              print("LOWCHART_PHOTO_PROBE "+json.dumps({"source_id":source["id"],"identity":id_summary,"lowchart_checked":False}))
              raise SystemExit(0)
          url = build_url(identity["product_id"],identity["item_id"])
          class Extract(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta=[]
                  self.imgs=[]
                  self.title=False
                  self.titletext=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=="meta" and "image" in (d.get("property","")+" "+d.get("name","")).lower():
                      if d.get("content"): self.meta.append((d.get("property") or d.get("name"),d["content"]))
                  if tag=="img": self.imgs.append({k:d.get(k) for k in ["src","alt","data-src"]})
                  if tag=="title":self.title=True
              def handle_endtag(self,tag):
                  if tag=="title":self.title=False
              def handle_data(self,data):
                  if self.title:self.titletext.append(data)
          try:
              req=request.Request(url,headers={"Accept":"text/html","User-Agent":"Mozilla/5.0"})
              with request.urlopen(req, timeout=20) as response:
                  body=response.read(1_800_001).decode("utf8","replace")
                  http=response.status
              parser=Extract();parser.feed(body)
              candidates=[]
              for key,val in parser.meta:
                  u=urlsplit(val)
                  candidates.append({"source":"meta","key":key,"host":u.hostname,"url_has_product_id":identity["product_id"] in val,"url_has_item_id":identity["item_id"] in val})
              for img in parser.imgs[:15]:
                  src=img.get("src") or img.get("data-src") or ""
                  full=urljoin(url,src)
                  candidates.append({"source":"img","host":urlsplit(full).hostname,
                                     "alt_prefix":(img.get("alt") or "")[:90],
                                     "url_has_product_id":identity["product_id"] in full,
                                     "url_has_item_id":identity["item_id"] in full})
              print("LOWCHART_PHOTO_PROBE "+json.dumps({
                  "source_id":source["id"],
                  "identity":id_summary,
                  "http":http,
                  "page_title":"".join(parser.titletext)[:160],
                  "page_has_ids":all(v in body for v in [identity["product_id"],identity["item_id"]]),
                  "image_meta_count":len(parser.meta),
                  "image_tags":len(parser.imgs),
                  "candidates":candidates[:18],
                  "published":0,"state_changed":False,
              },ensure_ascii=False))
          except Exception as exc:
              print("LOWCHART_PHOTO_PROBE "+json.dumps({"source_id":source["id"],"error_type":type(exc).__name__,
                                                      "identity":id_summary,"published":0}))
          PY
      - name: Validate downloadable exact-item product photos from Lowchart pages
        run: |
          python - <<'PY'
          import json
          import re
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib import request
          from urllib.parse import urlsplit
          from gh_only.shortlink_probe import one_hop
          from gh_only.lowchart_price_reference import build_url

          pending=json.loads(Path("state/daangn_jirum_manual_fifo.json").read_text("utf8"))["pending"]
          selected=[x for x in pending if x["id"] in {94789,94791,94800,94820,94834}]
          class FindImages(HTMLParser):
              def __init__(self):
                  super().__init__();self.items=[];self.title=False;self.title_data=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=="img" and d.get("alt") and (d.get("src") or d.get("data-src")):
                      self.items.append(d)
                  if tag=="title":self.title=True
              def handle_endtag(self,tag):
                  if tag=="title":self.title=False
              def handle_data(self,data):
                  if self.title:self.title_data.append(data)
          for source in selected:
              try:
                  identity=one_hop(source["original_purchase_url"])
                  if identity.get("result")!="DIRECT_PRODUCT_ID_CANDIDATE":
                      print("LOWCHART_ITEM_PHOTO "+json.dumps({"id":source["id"],"identity":identity.get("result")}))
                      continue
                  pid,iid=identity["product_id"],identity["item_id"]
                  req=request.Request(build_url(pid,iid),headers={"User-Agent":"Mozilla/5.0","Accept":"text/html"})
                  with request.urlopen(req,timeout=20) as resp: html=resp.read(1_800_000).decode("utf8","replace")
                  p=FindImages();p.feed(html)
                  page_title="".join(p.title_data).split(" - ")[0]
                  product_imgs=[d for d in p.items if d.get("alt","").strip()==page_title.strip()
                              and urlsplit(d.get("src") or d.get("data-src") or "").hostname in {
                                  "thumbnail.coupangcdn.com","thumbnail7.coupangcdn.com",
                                  "thumbnail8.coupangcdn.com","thumbnail6.coupangcdn.com"
                              }]
                  entry={"id":source["id"],"exact_ids_present":pid in html and iid in html,
                         "title_matches_source":any(token in page_title for token in source["title"].split()[:2]),
                         "matching_product_img_tags":len(product_imgs),
                         "image_hosts":list({urlsplit(d.get("src") or "").hostname for d in product_imgs})}
                  if source["id"]==94789 and len(product_imgs)==1:
                      url=product_imgs[0].get("src") or product_imgs[0].get("data-src")
                      u=urlsplit(url)
                      entry["candidate_ext"]=u.path[-8:]
                      req=request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"image/*"})
                      with request.urlopen(req,timeout=20) as resp:
                          data=resp.read(2_500_001)
                          entry.update({"download_status":resp.status,"mime":resp.headers.get_content_type(),
                                        "bytes":len(data),"jpeg_magic":data.startswith(b"\\xff\\xd8\\xff"),
                                        "png_magic":data.startswith(b"\\x89PNG")})
                  print("LOWCHART_ITEM_PHOTO "+json.dumps(entry,ensure_ascii=False))
              except Exception as exc:
                  print("LOWCHART_ITEM_PHOTO "+json.dumps({"id":source["id"],"error_type":type(exc).__name__}))
          PY
