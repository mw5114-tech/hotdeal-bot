name: Jirum Telegram delivery smoke test (single use)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jirum-delivery-smoke.yml'

permissions:
  contents: read

jobs:
  send_one_test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Send one clearly labeled test to existing Telegram destinations
        run: |
          python - <<'PY'
          from telegram_delivery import send_text
          send_text('🧪 뽐질 GitHub Actions 전송 점검 - 실제 핫딜 아님 (2026-10-31)')
          PY
