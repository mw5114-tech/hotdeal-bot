name: Tests | Jirum manual FIFO (offline only)

on:
  push:
    branches:
      - feat/manual-jirum-fifo-daangn-20261101
      - feat/daangn-fifo-30min-lean-20261101
      - fix/daangn-fifo-publish-diagnostics-20261101
      - fix/daangn-submit-wait-20261101
      - fix/daangn-submit-anchor-editor-20261101
      - diagnose/daangn-published-post-readonly-20261101
      - diagnose/daangn-photo-upload-readonly-20261101
      - fix/daangn-wait-image-upload-before-submit-20261101
      - feat/daangn-fifo-drain-backlog-20261101
      - fix/daangn-title-maxlength-preserve-discount-20261101
      - fix/daangn-editor-image-label-body-20261101
      - feat/daangn-fifo-5min-cron-20261101
      - fix/raw-watcher-event-dispatch-production-20261101
    paths:
      - 'gh_only/jirum_manual_*.py'
      - 'gh_only/test_jirum_manual_queue.py'
      - 'gh_only/test_jirum_manual_publisher.py'
      - 'gh_only/daangn_post_readonly_audit.py'
      - 'gh_only/daangn_photo_upload_probe.py'
      - '.github/workflows/daangn-photo-upload-probe.yml'
      - '.github/workflows/daangn-post-readonly-audit.yml'
      - '.github/workflows/daangn-jirum-manual-fifo.yml'
      - '.github/workflows/daangn-jirum-fifo-tests.yml'

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python Playwright library for existing legacy test imports
        run: python -m pip install --disable-pip-version-check playwright==1.64.1
      - name: Compile queue, publisher, tests
        run: |
          python -m py_compile gh_only/jirum_manual_queue.py gh_only/jirum_manual_publisher.py gh_only/test_jirum_manual_queue.py
          python -m unittest -v gh_only.test_jirum_manual_queue
          python -m py_compile gh_only/jirum_manual_publisher.py gh_only/test_jirum_manual_publisher.py gh_only/daangn_post_readonly_audit.py gh_only/daangn_photo_upload_probe.py
          python -m unittest -v gh_only.test_jirum_manual_publisher
          python - <<'PY'
          from pathlib import Path
          s = Path("gh_only/jirum_manual_publisher.py").read_text()
          assert 'get_by_role("button", name="글쓰기", exact=True)' in s
          assert 'expect(submit).to_be_enabled(timeout=18000)' in s
          assert 'submit.click(timeout=10000)' in s
          assert 'WAIT_IMAGE_UPLOAD_FINISH' in s
          assert 'photo_upload_completed' in s
          assert "includes('준비중')" in s
          assert 'PHOTO_UPLOAD_NOT_CONFIRMED_DO_NOT_SUBMIT' in s
          print("DAANGN_SUBMIT_WAIT_CONTRACT_OK")
          PY
          python -m unittest -v gh_only.test_default_deal_format gh_only.test_default_deal_automation gh_only.test_daangn_editor_probe
          python - <<'PY'
          from pathlib import Path
          yaml_text = Path(".github/workflows/daangn-jirum-manual-fifo.yml").read_text()
          assert "cron: '2-57/5 * * * *'" in yaml_text
          assert "workflow_dispatch:" in yaml_text
          assert "smoke_test:" in yaml_text
          assert "github.event_name != 'workflow_dispatch' || inputs.smoke_test != true" in yaml_text
          assert "NO_SCAN_NO_POST" in yaml_text
          assert "python -m gh_only.jirum_manual_queue drain" in yaml_text
          assert "python -m gh_only.jirum_manual_queue publish" not in yaml_text
          assert "steps.scan.outputs.has_deal == 'true'" in yaml_text
          assert "python -m unittest -v gh_only.test_jirum_manual_queue" not in yaml_text
          print("SCHEDULE_AND_LEAN_PIPELINE_CONTRACT_OK")
          PY

# Offline tests only. No live websites, no scheduled checks, no publish.
