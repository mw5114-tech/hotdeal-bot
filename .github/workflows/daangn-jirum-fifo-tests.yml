      - '.github/workflows/daangn-post-readonly-audit.yml'
      - 'archive/daangn/daangn-fifo-paused.yml'
      - '.github/workflows/daangn-jirum-fifo-tests.yml'

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python Playwright library for existing legacy test imports
        run: python -m pip install --disable-pip-version-check playwright==1.64.1
      - name: Compile queue, publisher, tests
        run: |
          python -m py_compile gh_only/jirum_manual_queue.py gh_only/jirum_manual_publisher.py gh_only/test_jirum_manual_queue.py
          python -m unittest -v gh_only.test_jirum_manual_queue gh_only.test_official_link_receipts gh_only.test_official_link_integration gh_only.test_direct_product_links gh_only.test_muse_postedit_flow gh_only.test_affsdp_candidate gh_only.test_affsdp_restore gh_only.test_one_shot_repost
          python -m py_compile tools/refresh_kakao_storage_secret.py tools/test_refresh_kakao_storage_secret.py
          python -m unittest -v tools.test_refresh_kakao_storage_secret
          python -m py_compile gh_only/jirum_manual_publisher.py gh_only/test_jirum_manual_publisher.py gh_only/daangn_post_readonly_audit.py gh_only/daangn_photo_upload_probe.py
          python -m unittest -v gh_only.test_jirum_manual_publisher
          python - <<'PY'
          from pathlib import Path
          s = Path("gh_only/jirum_manual_publisher.py").read_text()
          assert 'get_by_role("button", name="글쓰기", exact=True)' in s
          assert 'expect(submit).to_be_enabled(timeout=18000)' in s
          assert 'submit.click(timeout=10000)' in s
          assert 'WAIT_IMAGE_UPLOAD_FINISH' in s
          assert 'photo_upload_completed' in s
          assert "includes('준비중')" in s
          assert 'PHOTO_UPLOAD_NOT_CONFIRMED_DO_NOT_SUBMIT' in s
          print("DAANGN_SUBMIT_WAIT_CONTRACT_OK")
          PY
          python -m unittest -v gh_only.test_default_deal_format gh_only.test_default_deal_automation gh_only.test_daangn_editor_probe
          python -m unittest -v gh_only.test_lowchart_product_photo gh_only.test_search_product_photo gh_only.test_ordered_product_photos gh_only.test_fallcent_search_photo gh_only.test_fallcent_high_reference gh_only.test_naver_web_image_photo gh_only.test_naver_web_product_price gh_only.test_lowchart_price_reference gh_only.test_pipeline gh_only.test_telegram_public_retry
          python -m py_compile gh_only/lowchart_product_photo.py gh_only/default_deal_automation.py gh_only/pipeline.py jirum_forward.py
          python - <<'PY'
          from pathlib import Path
          yaml_text = Path("archive/daangn/daangn-fifo-paused.yml").read_text()
          assert "cron: '17,47 * * * *'" in yaml_text
          assert "workflow_dispatch:" in yaml_text
          assert "JIRUM_IMAGE_SOURCE: lowchart" in yaml_text
          assert "JIRUM_ENABLE_SEARCH_PHOTO_FALLBACK:" not in yaml_text
          assert "JIRUM_REQUIRE_FRESH_POST: 'true'" in yaml_text
          assert "JIRUM_REQUIRE_OFFICIAL_PARTNERS_LINK: 'false'" in yaml_text
          assert "JIRUM_PUBLISH_BEFORE_MUSE_REWRITE: 'false'" in yaml_text
          assert "COUPANG_PARTNER_LPTAG: AF9668915" in yaml_text
          assert "'links/*.json'" not in yaml_text
          assert "KAKAO_DEV_STORAGE_STATE_JSON:" not in yaml_text
          assert "smoke_test:" in yaml_text
          assert "github.event_name != 'workflow_dispatch' || inputs.smoke_test != true" in yaml_text
          assert "NO_SCAN_NO_POST" in yaml_text
          assert "python -m gh_only.jirum_manual_queue drain" in yaml_text
          assert "python -m gh_only.jirum_manual_queue publish" not in yaml_text
          assert "steps.scan.outputs.has_deal == 'true'" in yaml_text
          assert "python -m unittest -v gh_only.test_jirum_manual_queue" not in yaml_text
          print("SCHEDULE_AND_LEAN_PIPELINE_CONTRACT_OK")
          PY

# Offline tests only. No live websites, no scheduled checks, no publish.

