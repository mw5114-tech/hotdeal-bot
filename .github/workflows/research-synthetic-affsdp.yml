name: Compare synthetic AFFSDP tracking metadata (one HEAD)
on:
  pull_request:
    paths:
      - research_synthetic_affsdp_metadata.py
      - .github/workflows/research-synthetic-affsdp.yml
permissions:
  contents: read
jobs:
  metadata-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe constructed link redirect, no login or GET
        run: python research_synthetic_affsdp_metadata.py
