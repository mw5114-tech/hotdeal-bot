name: TEST ONLY | Kakao Developers Secrets login one-shot
on:
  push:
    branches:
      - test/kakao-login-secrets-20261104
    paths:
      - '.github/workflows/kakao-login-secrets-one-shot.yml'

permissions:
  contents: read

concurrency:
  group: kakao-developers-login-secret-test
  cancel-in-progress: false

jobs:
  one-shot-login:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      KAKAO_LOGIN_ID: ${{ secrets.KAKAO_LOGIN_ID }}
      KAKAO_LOGIN_PASSWORD: ${{ secrets.KAKAO_LOGIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --quiet --disable-pip-version-check playwright==1.64.1
          python -m playwright install --with-deps chromium > /dev/null 2>&1
      - name: Test one Kakao Developers login without storing session or posting
        run: python tools/test_kakao_login_actions_once.py

# Test only: no artifact upload, GH secret edits, screenshot, cookie export or publishing.
