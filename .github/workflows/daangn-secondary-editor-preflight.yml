name: Probe | Geojijeol cafe editor, no posting
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manual/trigger-daangn-secondary-editor-probe.txt'

permissions:
  contents: read

jobs:
  read-only-editor-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      DAANGN_CAFE_STORAGE_STATE_JSON: ${{ secrets.DAANGN_CAFE_STORAGE_STATE_JSON }}
      DAANGN_CAFE_RESTORED: 'true'
      DAANGN_SECONDARY_CAFE_MODE: 'true'
      DAANGN_SECONDARY_CAFE_ADMIN_PERMISSION_CONFIRMED: 'true'
      DAANGN_CAFE_TARGET_URL: https://cafe.daangn.com/geojijeol-yagje
      DAANGN_CAFE_BOARD_LABEL: '🧡절약 정보🥕'
      DAANGN_CAFE_PUBLISH_ENABLED: 'true'
      DAANGN_CAFE_PARTNERS_PERMISSION_CONFIRMED: 'true'
      DAANGN_PUBLISH_PAUSED: 'false'
      DAANGN_OFFICIAL_API_LINK_ENABLED: 'true'
      COUPANG_PARTNER_SUBID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only browser
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.64.1
          python -m playwright install --only-shell chromium
      - name: Verify membership, editor and board without composing or submitting
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          from gh_only.daangn_editor_probe import parse_daangn_storage_state
          from gh_only.jirum_manual_publisher import (
              target_for_cafe, restored_board_label, restored_live_gate,
          )
          assert restored_live_gate(), "SECONDARY_PERMISSION_GATE_CLOSED"
          target, prefix = target_for_cafe(os.environ["DAANGN_CAFE_TARGET_URL"])
          board_name = restored_board_label()
          storage = parse_daangn_storage_state(os.getenv("DAANGN_CAFE_STORAGE_STATE_JSON", ""))
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              try:
                  context = browser.new_context(storage_state=storage, locale="ko-KR")
                  page = context.new_page()
                  response = page.goto(target, wait_until="domcontentloaded", timeout=35000)
                  page.wait_for_timeout(1800)
                  landed = urlsplit(page.url)
                  if (not response or response.status != 200
                      or landed.scheme != "https" or landed.hostname != "cafe.daangn.com"
                      or landed.path != prefix + "new"):
                      raise RuntimeError("SECONDARY_EDITOR_LOGIN_OR_MEMBERSHIP_NOT_VERIFIED")
                  board = page.locator("select")
                  if board.count() != 1:
                      raise RuntimeError("SECONDARY_BOARD_SELECTOR_NOT_UNIQUE")
                  labels = [x.strip() for x in board.locator("option").all_inner_texts()]
                  if board_name not in labels:
                      raise RuntimeError("SECONDARY_APPROVED_BOARD_NOT_AVAILABLE")
                  board.select_option(label=board_name)
                  if board.locator("option:checked").inner_text().strip() != board_name:
                      raise RuntimeError("SECONDARY_BOARD_SELECTION_NOT_VERIFIED")
                  if page.locator("div.ProseMirror[contenteditable=true]").count() != 1:
                      raise RuntimeError("SECONDARY_EDITOR_NOT_AVAILABLE")
                  if page.locator('input[placeholder="제목을 입력해주세요."]').count() != 1:
                      raise RuntimeError("SECONDARY_TITLE_INPUT_NOT_AVAILABLE")
                  print("SECONDARY_EDITOR_AND_BOARD_VERIFIED_NO_WRITE_NO_SUBMIT")
              finally:
                  browser.close()
          PY
