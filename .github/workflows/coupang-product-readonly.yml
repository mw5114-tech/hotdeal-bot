name: Coupang single-product read-only access test

on:
  push:
    branches:
      - test/coupang-product-readonly-20261031
    paths:
      - .github/workflows/coupang-product-readonly.yml
      - experimental/coupang_product_readonly_probe.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coupang-single-readonly-probe
  cancel-in-progress: false

jobs:
  read-only-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run exactly one product-page navigation (no login and no retry)
        run: python experimental/coupang_product_readonly_probe.py
      - name: Preserve diagnostic JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupang-product-readonly-result
          path: coupang_probe_result.json
          if-no-files-found: warn
          retention-days: 7
