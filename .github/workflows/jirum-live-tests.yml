name: Jirum live watcher offline tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'jirum_live.py'
      - 'jirum_github_dispatch.py'
      - 'test_jirum_github_dispatch.py'
      - 'live_store.py'
      - 'live_telegram.py'
      - 'test_jirum_live.py'
      - 'requirements-live.txt'
      - 'deploy/**'
      - '.github/workflows/jirum-live-tests.yml'
  pull_request:
    paths:
      - 'jirum_live.py'
      - 'live_store.py'
      - 'live_telegram.py'
      - 'test_jirum_live.py'
      - 'requirements-live.txt'
      - 'deploy/**'
      - '.github/workflows/jirum-live-tests.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-live.txt
      # Only the watcher/relay tests. Unrelated Coupang session-export tests
      # depend on optional cryptography not installed on the live server.
      - run: python -m unittest -v test_jirum_live test_jirum_github_dispatch test_jirum_forward test_telegram_delivery
      - run: python -m py_compile jirum_live.py jirum_github_dispatch.py live_store.py live_telegram.py deploy/configure_live.py deploy/backup_state.py
      - run: bash -n deploy/install.sh
