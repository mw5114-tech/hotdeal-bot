name: Coupang session exporter offline tests
on:
  pull_request:
    paths:
      - coupang_session_export.py
      - test_coupang_session_export.py
      - .github/workflows/coupang-session-reuse.yml
      - .github/workflows/coupang-export-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography
      - run: python -m unittest -v test_coupang_session_export.py
