name: Tests | Daangn new cafe browser access (NO PUBLISH)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daangn-cafe-readonly-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cafe-editor-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      DAANGN_CAFE_STORAGE_STATE_JSON: ${{ secrets.DAANGN_CAFE_STORAGE_STATE_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only authentication and board check (NO writing/clicking)
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.64.1
          python -m playwright install --only-shell chromium
          python - <<'PY'
          import os, json
          from urllib.parse import urlsplit
          from gh_only.daangn_editor_probe import parse_daangn_storage_state
          from playwright.sync_api import sync_playwright
          raw = os.environ.get("DAANGN_CAFE_STORAGE_STATE_JSON", "")
          if not raw:
              print("DAANGN_NEW_CAFE_SESSION_SECRET_MISSING_NO_PUBLISH")
              raise SystemExit(0)
          try:
              state=parse_daangn_storage_state(raw)
          except ValueError as exc:
              print("DAANGN_NEW_CAFE_SESSION_UNUSABLE_NO_PUBLISH "+str(exc))
              raise SystemExit(0)
          target="https://cafe.daangn.com/kupang-teuggaye/posts/new"
          try:
              with sync_playwright() as play:
                  browser=play.chromium.launch(headless=True)
                  try:
                      ctx=browser.new_context(storage_state=state,locale="ko-KR")
                      page=ctx.new_page()
                      response=page.goto(target,wait_until="domcontentloaded",timeout=25000)
                      page.wait_for_timeout(1600)
                      selections=page.locator("select")
                      board=False
                      if selections.count()==1:
                          board="🔥 오늘의 핫딜" in selections.locator("option").all_inner_texts()
                      print("DAANGN_NEW_CAFE_READONLY "+json.dumps({
                          "http_status":response.status if response else None,
                          "correct_cafe_editor":urlsplit(page.url).path=="/kupang-teuggaye/posts/new",
                          "host_correct":urlsplit(page.url).hostname=="cafe.daangn.com",
                          "board_hotdeal_exists":board,
                          "editable_body_visible":page.locator("div.ProseMirror[contenteditable=true]").count()==1,
                          "no_post_submitted":True,
                      }))
                  finally:
                      browser.close()
          except Exception as exc:
              print("DAANGN_NEW_CAFE_BROWSER_CHECK_FAILED_NO_PUBLISH "+
                    type(exc).__name__)
          PY
