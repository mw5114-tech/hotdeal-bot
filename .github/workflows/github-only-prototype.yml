name: GitHub-only deal evidence prototype (read-only)

on:
  push:
    branches:
      - test/github-only-pipeline-20261031
    paths:
      - 'gh_only/**'
      - '.github/workflows/github-only-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-only-deal-prototype
  cancel-in-progress: false

jobs:
  offline-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static syntax check
        run: python -m py_compile gh_only/pipeline.py gh_only/test_pipeline.py gh_only/partner_api.py gh_only/test_partner_api.py gh_only/mtproto_reader.py gh_only/test_mtproto_reader.py gh_only/daangn_draft.py gh_only/test_daangn_draft.py
      - name: Deterministic tests (no credentials / no network)
        run: python -m unittest -v gh_only.test_pipeline gh_only.test_partner_api gh_only.test_mtproto_reader gh_only.test_daangn_draft
      - name: Build fixture evidence report
        run: python -m gh_only.pipeline --mode fixture --fixture-html gh_only/fixtures/jirum_sample.html --output fixture_deal_report.json
      - name: Build synthetic Jirum Daangn drafts (no posting)
        run: python -m gh_only.daangn_draft --mode fixture --fixture-html gh_only/fixtures/jirum_sample.html --output fixture_daangn_drafts.json
      - name: Archive fixture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-only-fixture-evidence
          path: |
            fixture_deal_report.json
            fixture_daangn_drafts.json
          if-no-files-found: warn
          retention-days: 7

  read-public-telegram-once:
    needs: offline-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One public Telegram listing request, no Coupang access, no posting
        run: python -m gh_only.pipeline --mode live --output live_deal_report.json
      - name: Prepare Daangn drafts from the same Telegram response (no extra requests)
        run: python -m gh_only.daangn_draft --mode evidence --evidence-json live_deal_report.json --output live_daangn_drafts.json
      - name: Archive public-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-only-public-telegram-evidence
          path: |
            live_deal_report.json
            live_daangn_drafts.json
          if-no-files-found: warn
          retention-days: 7

  optional-telegram-attachment-reader:
    if: vars.GH_ONLY_MT_READER_TEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
      GH_ONLY_SOURCE_USERNAME: ${{ vars.GH_ONLY_SOURCE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free Telegram MTProto client (explicit opt-in only)
        run: python -m pip install 'telethon>=1.37,<2'
      - name: Read eight messages with existing user authorization, no login prompts
        run: python -m gh_only.mtproto_reader
      - name: Preserve diagnostic metadata and downloaded media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-only-telegram-mtproto-evidence
          path: |
            gh_only_mtproto_report.json
            gh_only_mtproto_images/
          if-no-files-found: warn
          retention-days: 3
