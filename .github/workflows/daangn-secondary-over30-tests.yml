name: Tests | Daangn secondary strictly over 30 percent
on:
  push:
    branches: [main]
    paths:
      - 'gh_only/jirum_manual_queue.py'
      - 'gh_only/jirum_manual_publisher.py'
      - 'gh_only/test_daangn_secondary_over30.py'
      - 'gh_only/test_jirum_manual_queue.py'
      - 'gh_only/test_jirum_manual_publisher.py'
      - '.github/workflows/daangn-cafe-geojijeol-over30.yml'
      - '.github/workflows/naver-blog-auto-main.yml'
      - '.github/workflows/daangn-secondary-over30-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secondary-no-post-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install no-post import dependency
        run: python -m pip install --disable-pip-version-check --quiet playwright==1.64.1 Pillow==11.3.0
      - name: Compile and test independent cafe thresholds and existing FIFO
        run: |
          python -m compileall -q gh_only/jirum_manual_queue.py gh_only/jirum_manual_publisher.py gh_only/test_daangn_secondary_over30.py
          python -m unittest -q gh_only.test_daangn_secondary_over30 gh_only.test_jirum_manual_queue gh_only.test_jirum_manual_publisher
      - name: Verify realtime dispatch and independent workflow gates
        run: |
          python - <<'PY'
          from pathlib import Path
          secondary = Path('.github/workflows/daangn-cafe-geojijeol-over30.yml').read_text()
          primary = Path('.github/workflows/daangn-cafe-restored.yml').read_text()
          oracle = Path('.github/workflows/naver-blog-auto-main.yml').read_text()
          assert 'DAANGN_SECONDARY_CAFE_MODE:' in secondary
          assert 'DAANGN_SECONDARY_CAFE_ADMIN_PERMISSION_CONFIRMED:' in secondary
          assert 'https://cafe.daangn.com/geojijeol-yagje' in secondary
          assert 'DAANGN_CAFE_BOARD_LABEL:' in secondary
          assert 'group: daangn-geojijeol-over30-fifo' in secondary
          assert 'DAANGN_SECONDARY_CAFE_MODE:' not in primary
          assert 'https://cafe.daangn.com/kupang-teuggaye' in primary
          assert 'daangn-geojijeol-over30:' in oracle
          assert 'uses: ./.github/workflows/daangn-cafe-geojijeol-over30.yml' in oracle
          print('SECONDARY_ISOLATION_AND_REALTIME_DISPATCH_OK')
          PY
