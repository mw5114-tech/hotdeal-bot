name: Probe | Public image draft (read-only)
on:
  push:
    branches: [feat/lowchart-photo-fresh-deals-20261102]
    paths: ['.github/workflows/probe-lowchart-draft-no-post.yml', 'gh_only/probe_lowchart_no_post.py', 'gh_only/default_deal_automation.py', 'gh_only/lowchart_product_photo.py']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m gh_only.probe_lowchart_no_post
