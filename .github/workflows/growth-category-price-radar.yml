name: Growth Lab 2 | Verified price drop V2

on:
  workflow_dispatch:
  schedule:
    # 12 light jobs/day, 2 API calls each; all six categories every 6h.
    # KST 09:35,11:35,...,07:35 next day. 24 category calls/day.
    # Stays well below documented 100-per-hour non-search affiliate limit.
    - cron: '35 */2 * * *'

permissions:
  contents: write

concurrency:
  group: growth-category-radar-independent
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      COUPANG_PARTNERS_ACCESS_KEY: ${{ secrets.COUPANG_PARTNERS_ACCESS_KEY }}
      COUPANG_PARTNERS_SECRET_KEY: ${{ secrets.COUPANG_PARTNERS_SECRET_KEY }}
      GROWTH_LAB_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect 6h option observations and verify real 24h + 30d drops
        run: python -m growth_lab.price_radar
