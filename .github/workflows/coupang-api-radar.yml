name: Coupang API Radar | isolated product discovery

# Independent from Telegram, Oracle, Naver blog publishing and their FIFO states.
# Discovery and price tracking are independent; conditional gated publish is separate.
on:
  push:
    branches: [main]
    paths:
      - 'api_radar/**'
      - '.github/workflows/coupang-api-radar.yml'
  workflow_dispatch:
  schedule:
    # Fresh official Goldbox snapshots: 08:05,12:10,16:25,20:40 KST.
    # Existing product IDs are never re-posted, including on later days.
    - cron: '5 23 * * *'
    - cron: '10 3 * * *'
    - cron: '25 7 * * *'
    - cron: '40 11 * * *'
    # One A/B item every 15m during 08:22-23:52 KST, on off-peak minutes.
    # Actual spacing >=900s from prior confirmed or uncertain submit.
    # GitHub cron can be delayed/dropped; it is not an exact-time promise.
    - cron: '22,37,52 23 * * *'  # 08:22/08:37/08:52 KST
    - cron: '7,22,37,52 0-14 * * *'  # 09:07-23:52 KST

permissions:
  contents: write

concurrency:
  group: coupang-api-radar-independent
  cancel-in-progress: false

jobs:
  discover:
    # Publishing-only 15m slots do not need a separate runner just for tests.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || (github.event.schedule != '22,37,52 23 * * *' && github.event.schedule != '7,22,37,52 0-14 * * *'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline unit tests - no network, no publishing
        run: python -m unittest -v api_radar.test_collector api_radar.test_state_store api_radar.test_quality_pipeline
      - name: Independent product discovery (Goldbox + one search, no publish)
        if: github.event_name != 'push'
        env:
          COUPANG_PARTNERS_ACCESS_KEY: ${{ secrets.COUPANG_PARTNERS_ACCESS_KEY }}
          COUPANG_PARTNERS_SECRET_KEY: ${{ secrets.COUPANG_PARTNERS_SECRET_KEY }}
          API_RADAR_SEARCH_ENABLED: 'true'
        run: python -m api_radar.collector
      - name: Persist public product observations on separate data branch
        if: github.event_name != 'push' && github.event.schedule != '55 0-13 * * *'
        env:
          API_RADAR_GITHUB_TOKEN: ${{ github.token }}
        run: python -m api_radar.state_store
      - name: Keep public-product summary only (not session or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-radar-${{ github.run_id }}
          path: |
            api-radar-output/summary.json
            api-radar-output/ranked.json
          if-no-files-found: ignore
          retention-days: 2

  publish:
    # The discovery job never opens a browser. Only this independent job can
    # publish, under the SAME Naver browser mutex as the Telegram publisher.
    needs: discover
    # A scheduled release may run after discover is intentionally skipped.
    # New scans only add the day's queue; never publish immediately in a burst.
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'schedule' && needs.discover.result == 'skipped' && (github.event.schedule == '22,37,52 23 * * *' || github.event.schedule == '7,22,37,52 0-14 * * *')
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: write
    concurrency:
      group: naver-blog-jirum-state-and-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check required authentication exists without exposing values
        id: ready
        env:
          NAVER_BLOG_STORAGE_STATE_JSON: ${{ secrets.NAVER_BLOG_STORAGE_STATE_JSON }}
          COUPANG_PARTNERS_ACCESS_KEY: ${{ secrets.COUPANG_PARTNERS_ACCESS_KEY }}
          COUPANG_PARTNERS_SECRET_KEY: ${{ secrets.COUPANG_PARTNERS_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os
          keys = ("NAVER_BLOG_STORAGE_STATE_JSON","COUPANG_PARTNERS_ACCESS_KEY",
                  "COUPANG_PARTNERS_SECRET_KEY")
          ready = all(bool(os.getenv(key)) for key in keys)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("ready=" + str(ready).lower() + "\n")
          print("API_RADAR_PUBLISH_CREDENTIALS_READY=" + str(ready).lower())
          PY
      - name: Check queue on public Goldbox data branch before installing browser
        if: steps.ready.outputs.ready == 'true'
        id: backlog
        env:
          API_RADAR_GITHUB_TOKEN: ${{ github.token }}
          API_RADAR_PENDING_ONLY: 'true'
        run: python -m api_radar.publisher
      - name: Install Naver editor browser only when a backlog exists
        if: steps.ready.outputs.ready == 'true' && steps.backlog.outputs.pending == 'true'
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.64.1
          python -m playwright install --only-shell chromium
          if ! python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'; then
            python -m playwright install --with-deps --only-shell chromium
          fi
      - name: Release exactly one verified A/B Goldbox item per 15-minute slot
        if: steps.ready.outputs.ready == 'true' && steps.backlog.outputs.pending == 'true'
        env:
          API_RADAR_PUBLISH_ENABLED: 'true'
          API_RADAR_GITHUB_TOKEN: ${{ github.token }}
          API_RADAR_TREND_MODE: 'curated'
          NAVER_BLOG_STORAGE_STATE_JSON: ${{ secrets.NAVER_BLOG_STORAGE_STATE_JSON }}
          COUPANG_PARTNERS_ACCESS_KEY: ${{ secrets.COUPANG_PARTNERS_ACCESS_KEY }}
          COUPANG_PARTNERS_SECRET_KEY: ${{ secrets.COUPANG_PARTNERS_SECRET_KEY }}
        run: python -m api_radar.publisher
      - name: Skip safely if required existing credentials are not set
        if: steps.ready.outputs.ready != 'true'
        run: echo 'API_RADAR_POST_SKIPPED_MISSING_SESSION_OR_PARTNERS_KEYS'
