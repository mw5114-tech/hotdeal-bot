name: Coupang API Radar | isolated product discovery

# Independent from Telegram, Oracle, Naver blog publishing and their FIFO states.
# This rollout discovers/ranks candidates only. No automatic blog posting.
on:
  push:
    branches: [main]
    paths:
      - 'api_radar/**'
      - '.github/workflows/coupang-api-radar.yml'
  workflow_dispatch:
  schedule:
    # 08:05 and 18:20 Asia/Seoul: daily featured products and one rotated search.
    - cron: '5 23 * * *'
    - cron: '20 9 * * *'

permissions:
  contents: write

concurrency:
  group: coupang-api-radar-independent
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline unit tests - no network, no publishing
        run: python -m unittest -v api_radar.test_collector api_radar.test_state_store
      - name: One-time signed-search API smoke probe (no post)
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'probe: validate corrected Coupang search HMAC once v2'
        env:
          COUPANG_PARTNERS_ACCESS_KEY: ${{ secrets.COUPANG_PARTNERS_ACCESS_KEY }}
          COUPANG_PARTNERS_SECRET_KEY: ${{ secrets.COUPANG_PARTNERS_SECRET_KEY }}
        run: |
          python - <<'PY'
          from api_radar.collector import get_api, SEARCH, extract_rows
          rows = extract_rows(get_api(SEARCH, {"keyword": "가습기", "limit": 10}))
          print("COUPANG_SEARCH_SMOKE_OK result_count=" + str(len(rows)) + " posts=0")
          PY
      - name: Independent product discovery (Goldbox only, no publish)
        if: github.event_name != 'push'
        env:
          COUPANG_PARTNERS_ACCESS_KEY: ${{ secrets.COUPANG_PARTNERS_ACCESS_KEY }}
          COUPANG_PARTNERS_SECRET_KEY: ${{ secrets.COUPANG_PARTNERS_SECRET_KEY }}
          API_RADAR_SEARCH_ENABLED: 'false'
        run: python -m api_radar.collector
      - name: Persist public product observations on separate data branch
        if: github.event_name != 'push'
        env:
          API_RADAR_GITHUB_TOKEN: ${{ github.token }}
        run: python -m api_radar.state_store
      - name: Keep public-product summary only (not session or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-radar-${{ github.run_id }}
          path: |
            api-radar-output/summary.json
            api-radar-output/ranked.json
          if-no-files-found: ignore
          retention-days: 2
