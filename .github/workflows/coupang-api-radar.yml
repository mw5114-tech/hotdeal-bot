name: Coupang API Radar | isolated product discovery

# Independent from Telegram, Oracle, Naver blog publishing and their FIFO states.
# This rollout discovers/ranks candidates only. No automatic blog posting.
on:
  push:
    branches: [main]
    paths:
      - 'api_radar/**'
      - '.github/workflows/coupang-api-radar.yml'
  workflow_dispatch:
  schedule:
    # 08:05 and 18:20 Asia/Seoul: one featured-products call and one search each run.
    - cron: '5 23 * * *'
    - cron: '20 9 * * *'

permissions:
  contents: write

concurrency:
  group: coupang-api-radar-independent
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline unit tests - no network, no publishing
        run: python -m unittest -v api_radar.test_collector api_radar.test_state_store api_radar.test_quality_pipeline
      - name: One-time aggregate search filter diagnosis (no publish)
        if: >-
          github.event_name == 'push' &&
          github.event.head_commit.message == 'probe: diagnose search normalization predicates once'
        env:
          COUPANG_PARTNERS_ACCESS_KEY: ${{ secrets.COUPANG_PARTNERS_ACCESS_KEY }}
          COUPANG_PARTNERS_SECRET_KEY: ${{ secrets.COUPANG_PARTNERS_SECRET_KEY }}
        run: |
          python - <<'PY'
          from collections import Counter
          from urllib.parse import urlsplit
          from api_radar.collector import SEARCH, get_api, extract_rows, normalize, safe_url, BLACKLIST
          import re, json
          rows=extract_rows(get_api(SEARCH, {"keyword":"가습기","limit":10}))
          counts=Counter()
          for row in rows:
              name=row.get("productName")
              price=row.get("productPrice")
              pid=row.get("productId")
              image=row.get("productImage")
              url=row.get("productUrl")
              checks={
                  "name": isinstance(name,str) and 6<=len(name.strip())<=160,
                  "price": type(price) in (int,float) and 1000<=price<=4_000_000 and float(price).is_integer(),
                  "pid": bool(re.fullmatch(r"\d{5,18}",str(pid))),
                  "image": safe_url(image,image=True),
                  "link": safe_url(url),
                  "no_blacklist": isinstance(name,str) and not any(bad in name for bad in BLACKLIST),
              }
              counts.update({"pass_"+k:int(v) for k,v in checks.items()})
              if isinstance(image,str):
                  u=urlsplit(image)
                  segs=u.path.strip("/").split("/")
                  counts.update({"image_segment_count_"+str(len(segs)):1,
                                 "image_seg_1_len_"+str(len(segs[0])):1})
                  counts.update({"image_has_"+ch:1 for ch in sorted({q for q in u.path
                               if not q.isalnum() and q not in "/._-~%"})})
                  counts["image_query_present"]+=bool(u.query)
              counts["valid"]+=normalize(row,"search") is not None
          print("API_RADAR_SEARCH_FILTER_COUNTS "+json.dumps(dict(counts),sort_keys=True))
          print("API_RADAR_SEARCH_DIAGNOSTIC_COMPLETE posts=0")
          PY
      - name: Independent product discovery (Goldbox + one search, no publish)
        if: github.event_name != 'push'
        env:
          COUPANG_PARTNERS_ACCESS_KEY: ${{ secrets.COUPANG_PARTNERS_ACCESS_KEY }}
          COUPANG_PARTNERS_SECRET_KEY: ${{ secrets.COUPANG_PARTNERS_SECRET_KEY }}
          API_RADAR_SEARCH_ENABLED: 'true'
        run: python -m api_radar.collector
      - name: Persist public product observations on separate data branch
        if: github.event_name != 'push'
        env:
          API_RADAR_GITHUB_TOKEN: ${{ github.token }}
        run: python -m api_radar.state_store
      - name: Keep public-product summary only (not session or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-radar-${{ github.run_id }}
          path: |
            api-radar-output/summary.json
            api-radar-output/ranked.json
          if-no-files-found: ignore
          retention-days: 2

  publish:
    # The discovery job never opens a browser. Only this independent job can
    # publish, under the SAME Naver browser mutex as the Telegram publisher.
    needs: discover
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
    concurrency:
      group: naver-blog-jirum-state-and-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check required authentication exists without exposing values
        id: ready
        env:
          NAVER_BLOG_STORAGE_STATE_JSON: ${{ secrets.NAVER_BLOG_STORAGE_STATE_JSON }}
          COUPANG_PARTNERS_ACCESS_KEY: ${{ secrets.COUPANG_PARTNERS_ACCESS_KEY }}
          COUPANG_PARTNERS_SECRET_KEY: ${{ secrets.COUPANG_PARTNERS_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os
          keys = ("NAVER_BLOG_STORAGE_STATE_JSON","COUPANG_PARTNERS_ACCESS_KEY",
                  "COUPANG_PARTNERS_SECRET_KEY")
          ready = all(bool(os.getenv(key)) for key in keys)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("ready=" + str(ready).lower() + "\n")
          print("API_RADAR_PUBLISH_CREDENTIALS_READY=" + str(ready).lower())
          PY
      - name: Install Naver editor browser only when all required keys exist
        if: steps.ready.outputs.ready == 'true'
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.64.1
          python -m playwright install --only-shell chromium
          if ! python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'; then
            python -m playwright install --with-deps --only-shell chromium
          fi
      - name: Publish at most one fully verified API offer per KST day
        if: steps.ready.outputs.ready == 'true'
        env:
          API_RADAR_PUBLISH_ENABLED: 'true'
          API_RADAR_GITHUB_TOKEN: ${{ github.token }}
          API_RADAR_TREND_MODE: 'curated'
          NAVER_BLOG_STORAGE_STATE_JSON: ${{ secrets.NAVER_BLOG_STORAGE_STATE_JSON }}
          COUPANG_PARTNERS_ACCESS_KEY: ${{ secrets.COUPANG_PARTNERS_ACCESS_KEY }}
          COUPANG_PARTNERS_SECRET_KEY: ${{ secrets.COUPANG_PARTNERS_SECRET_KEY }}
        run: python -m api_radar.publisher
      - name: Skip safely if required existing credentials are not set
        if: steps.ready.outputs.ready != 'true'
        run: echo 'API_RADAR_POST_SKIPPED_MISSING_SESSION_OR_PARTNERS_KEYS'
