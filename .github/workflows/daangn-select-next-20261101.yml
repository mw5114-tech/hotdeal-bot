name: Select latest NEW Jirum deal for one Daangn format test (NO PUBLISH)
on:
  push:
    branches:
      - test/daangn-new-format-one-post-20261101
    paths:
      - .github/workflows/daangn-select-next-20261101.yml
permissions:
  contents: read
jobs:
  pick:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      COUPANG_PARTNER_LPTAG: AF9668915
      KAKAO_DEV_STORAGE_STATE_JSON: ${{ secrets.KAKAO_DEV_STORAGE_STATE_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Preview newest Jirum deal except already-published 94737 and 94738
        run: python -m gh_only.default_deal_automation --max-source-posts 20 --exclude-source-id 94737 --exclude-source-id 94738 --output-dir one-post-preview
      - name: Save private preview only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daangn-preview-new-format-one
          path: one-post-preview/
          retention-days: 1
          if-no-files-found: warn
