name: Probe | Telegram public timestamp (READ ONLY)
on:
  push:
    branches:
      - feat/lowchart-photo-fresh-deals-20261102
    paths:
      - '.github/workflows/probe-telegram-message-time.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch public Telegram page only; no state changes
        run: |
          python - <<'PY'
          from gh_only.pipeline import enrich_posts,fetch_public_html
          rows=enrich_posts(fetch_public_html(),max_posts=80)
          print("TELEGRAM_DATES", [(r["source_message_id"],r.get("posted_at_utc")) for r in rows[-12:]])
          print("ALL_TIMED",sum(r.get("posted_at_utc") is not None for r in rows),len(rows))
          PY
