name: DIAGNOSTIC | Verify already-posted Daangn 94744 (READ ONLY)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'manual/trigger-daangn-audit.txt'

permissions:
  contents: read

jobs:
  audit-existing-post:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      DAANGN_CAFE_STORAGE_STATE_JSON: ${{ secrets.DAANGN_CAFE_STORAGE_STATE_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only browser dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Check exact saved post (NEVER edit or submit)
        run: python -m gh_only.daangn_post_readonly_audit
