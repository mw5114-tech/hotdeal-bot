name: Probe | Lowchart public price-series structure (read only)
on:
  push:
    branches: [feature/lowchart-generated-charts-20261114]
permissions:
  contents: read
jobs:
  inspect-public-page:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.64.1
          python -m playwright install --only-shell chromium
      - name: Inspect public JSON and chart DOM; no login, posts or private API calls
        run: |
          python - <<'PY'
          import json,re
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          ids=[("7098352204","19148341413"),("1487703230","2554295884")]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              try:
                  for product,item in ids:
                      context=browser.new_context(locale="ko-KR",viewport={"width":1180,"height":950})
                      page=context.new_page()
                      responses=[]
                      def capture(r):
                          u=urlsplit(r.url)
                          if u.hostname and u.hostname.endswith("lowchart.com"):
                              ct=r.headers.get("content-type","").split(";")[0]
                              if len(responses)<80:
                                  responses.append({"path":u.path[:120],"type":ct,
                                                    "status":r.status,"size":r.headers.get("content-length","")})
                      page.on("response",capture)
                      url=f"https://www.lowchart.com/{product}-{item}"
                      response=page.goto(url,wait_until="domcontentloaded",timeout=20000)
                      page.get_by_role("button",name="차트 퍼가기").wait_for(timeout=9000)
                      page.wait_for_timeout(1000)
                      info=page.evaluate("""() => {
                        const scriptNodes=[...document.querySelectorAll('script')];
                        const scripts=scriptNodes.map(s=>({
                          id:s.id,typ:s.type,src:s.src?new URL(s.src).pathname:null,
                          length:(s.textContent||'').length,
                          matching:(s.textContent||'').match(/priceHistory|price_history|chartData|dataPoints|prices|timestamps|series|dateList|historyData/gi)?.slice(0,15)||[],
                          dateSamples:(s.textContent||'').match(/202[0-9]-[01][0-9]-[0-3][0-9]/g)?.slice(0,8)||[]
                        }));
                        const headings=[...document.querySelectorAll('h1,h2,h3,h4')].filter(x=>(x.innerText||'').includes('지금 사도'));
                        const h=headings[0];const b=[...document.querySelectorAll('button')].find(x=>(x.innerText||'').includes('차트 퍼가기'));
                        const visuals=[...document.querySelectorAll('img,canvas,svg')].map(x=>({tag:x.tagName,
                          src:x.tagName==='IMG'?(new URL(x.currentSrc||x.src||location.href)).pathname:null,
                          alt:x.alt||null, w:Math.round(x.getBoundingClientRect().width),
                          h:Math.round(x.getBoundingClientRect().height), naturalW:x.naturalWidth||null,
                          between:!!h&&!!b&&x.getBoundingClientRect().top>h.getBoundingClientRect().bottom-20&&
                            x.getBoundingClientRect().bottom<b.getBoundingClientRect().top+35
                        })).filter(x=>x.between||x.w>=600).slice(0,18);
                        return {scriptCount:scripts.length, scripts:scripts.filter(x=>x.length>0||x.matching.length),
                          visuals, globalKeys:Object.keys(window).filter(k=>/chart|price|history|data/i.test(k)).slice(0,40),
                          visibleChartText:document.body.innerText.includes('최근 3주 평균')};
                      }""")
                      raw=page.evaluate("""() => {
                        const ss=[...document.querySelectorAll('script')].map(x=>x.textContent||'');
                        const matching=ss.filter(x=>x.includes('price_history'));
                        return matching.map(t=>{
                          const i=t.indexOf('price_history');
                          return {length:t.length,excerpt:t.slice(Math.max(0,i-350),i+1800),
                            numberOfDates:(t.match(/202[0-9]-[0-9]{2}-[0-9]{2}/g)||[]).length,
                            numberOfPrices:(t.match(/price/gi)||[]).length};
                        }).slice(0,2);
                      }""")
                      print("LOWCHART_PUBLIC_SERIES_SCRIPT "+json.dumps({"identity":[product,item],"scriptExcerpts":raw},ensure_ascii=False))
                      print("LOWCHART_PUBLIC_PROBE "+json.dumps({"identity":[product,item],
                        "status":response.status if response else None,
                        "responsePaths":responses,"browserInfo":info},ensure_ascii=False))
                      context.close()
              finally:
                  browser.close()
          PY

  verify-generated-chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      JIRUM_LOWCHART_CHART_MODE: generated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline syntactic and price-source tests
        run: |
          python -m compileall -q gh_only/lowchart_generated_price_chart.py gh_only/naver_blog_deal_publisher.py gh_only/jirum_manual_publisher.py gh_only/daangn_editor_probe.py
          python -m unittest gh_only.test_lowchart_generated_price_chart gh_only.test_lowchart_chart_capture gh_only.test_naver_blog_format gh_only.test_jirum_manual_publisher gh_only.test_daangn_editor_probe gh_only.test_naver_blog_jirum
      - run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.64.1
          python -m playwright install --only-shell chromium
      - name: Generate two distinct price cards using truthful public summary fixtures
        run: |
          python - <<'PY'
          import copy,hashlib
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from gh_only.test_lowchart_generated_price_chart import ROW
          from gh_only.daangn_editor_probe import _verified_lowchart_chart_identity
          from gh_only.lowchart_generated_price_chart import generate_price_chart_image
          output=Path("generated-price-chart-artifacts")
          one=copy.deepcopy(ROW)
          two=copy.deepcopy(ROW)
          two["product_identity"].update(product_id="1487703230",item_id="2554295884")
          two["history"].update(product_id="1487703230",item_id="2554295884",
            source_url="https://www.lowchart.com/1487703230-2554295884",
            observed_low_krw=12250,observed_high_krw=28000,observed_current_krw=17880,
            observed_average_krw=19190)
          two["caption"].update(comparison_reference_price_krw=19190,sale_price_krw=14120)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              try:
                  p1=generate_price_chart_image(browser,_verified_lowchart_chart_identity(one),output,95999)
                  p2=generate_price_chart_image(browser,_verified_lowchart_chart_identity(two),output,96004)
              finally:
                  browser.close()
          assert p1 is not None and p2 is not None
          b1=p1.read_bytes(); b2=p2.read_bytes()
          assert b1[:8]==b'\x89PNG\r\n\x1a\n' and b2[:8]==b'\x89PNG\r\n\x1a\n'
          assert b1!=b2
          assert len(b1)<2_500_000 and len(b2)<2_500_000
          print("GENERATED_CARD_LIVE_RENDER_OK",p1.name,len(b1),p2.name,len(b2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-price-summaries-readonly
          path: generated-price-chart-artifacts/
          retention-days: 1
          if-no-files-found: ignore
