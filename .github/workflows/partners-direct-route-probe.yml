name: Coupang Partners direct quick-link route ordinary access + canonical link proof

on:
  push:
    branches: [test/github-only-pipeline-20261031]
    paths:
      - '.github/workflows/partners-direct-route-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ordinary-http-and-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original Telegram links become clean exact product URLs (offline)
        run: python -m unittest -v gh_only.test_partners_link_prep
      - name: Install ordinary Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Compare normal HTTP GET with documented quick-link hash route in Chromium
        run: python -m gh_only.partners_access_methods_probe
      - name: Test first hop from 2 user-supplied hotdeal links without following to product page
        run: python -m gh_only.partners_link_prep
      - name: Preserve only anonymous access diagnostics (no cookies)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partners-direct-url-and-input-prep
          path: partners_access_methods.json
          if-no-files-found: warn
          retention-days: 3
