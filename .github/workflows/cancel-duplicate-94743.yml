name: Cancel duplicate Jirum 94743 publication run
on:
  push:
    branches: [test/daangn-publish-next-94743-20261101]
    paths: [.github/workflows/cancel-duplicate-94743.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel_duplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate one-shot run before posting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/mw5114-tech/hotdeal-bot/actions/runs/41266348151/cancel"
