name: NAVER BLOG | Legacy Oracle entrypoint (forward only)

# Existing Oracle servers still calling this old filename remain functional.
# No Daangn code or scan is invoked here; main Naver is a reusable workflow.
on:
  workflow_dispatch:
    inputs:
      source_post_id:
        description: 'Legacy Oracle Telegram event post ID'
        required: false
        default: ''
        type: string
      smoke_test:
        description: 'Read-only dispatch check; never publish'
        required: false
        default: false
        type: boolean

# The called Naver workflow needs repository contents:write for its OWN state.
permissions:
  contents: write

jobs:
  forward-to-naver-main:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    uses: ./.github/workflows/naver-blog-auto-main.yml
    with:
      source_post_id: ${{ inputs.source_post_id }}
      smoke_test: ${{ inputs.smoke_test }}
    secrets: inherit
