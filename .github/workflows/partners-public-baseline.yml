name: Partners public reachability baseline
on:
  push:
    branches: [codex/partners-session-ui-20261101]
    paths: [.github/workflows/partners-public-baseline.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: One anonymous navigation, no credentials or retry
        run: |
          python - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright
          report={"credentials_used":False,"navigation_attempts":1}
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True)
                  context=browser.new_context(locale="ko-KR")
                  page=context.new_page()
                  response=page.goto("https://partners.coupang.com/#affiliate/ws/link-to-any-page",wait_until="domcontentloaded",timeout=25000)
                  report["http_status"]=response.status if response else None
                  report["denied_text"]="access denied" in page.locator("body").inner_text(timeout=5000).lower()
                  report["outcome"]="PUBLIC_ACCESS_DENIED" if report["http_status"]==403 or report["denied_text"] else "PUBLIC_NAVIGATION_NOT_DENIED"
                  browser.close()
          except Exception as exc:
              report["outcome"]="DIAGNOSTIC_ERROR"
              report["error_type"]=type(exc).__name__
          text=json.dumps(report)
          print("PUBLIC_BASELINE "+text)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f: f.write(text)
          PY
