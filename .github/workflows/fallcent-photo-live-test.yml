name: TEST ONLY | Fallcent second-source live photo check
on:
  push:
    branches:
      - feat/fallcent-photo-second-before-naver-20261104
    paths:
      - '.github/workflows/fallcent-photo-live-test.yml'
permissions:
  contents: read
jobs:
  photo-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: GET Fallcent public search and one image, never publish
        run: |
          python - <<'PY'
          from pathlib import Path
          from gh_only.fallcent_search_photo import fetch_fallcent_product_photo
          title = "26년 신안 천일염 햇소금10kg 태평염전 간수뺀, 1개"
          r = fetch_fallcent_product_photo(title, Path("fallcent-live-photo"), 999999)
          print("FALLCENT_REAL_RESULT", {
              "status":r.get("status"),
              "provider":r.get("provider"),
              "image_source":r.get("image_source"),
              "bytes":r.get("bytes"),
              "matched_title":r.get("image_provider_title"),
          })
          assert r.get("status") == "IMAGE_SAVED", "No relevant downloadable Fallcent photo"
          PY
      - name: Save image as temporary evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fallcent-production-parser-photo
          path: fallcent-live-photo/
          retention-days: 1
          if-no-files-found: error
