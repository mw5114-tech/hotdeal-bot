name: DealSpot + Naver Cafe new-item alerts

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      preview:
        description: 'Preview both sites without sending Telegram messages'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

# Preview is read-only and must not block scheduled state-changing scans.
# Scheduled/real scans stay serialized with the manual Naver verification workflow.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.preview && 'hotdeal-preview' || 'hotdeal-state' }}
  cancel-in-progress: false

jobs:
  scan:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.BOT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check both scanners and unit tests
        id: checks
        run: |
          python -m py_compile new_items.py naver_cafe_probe.py naver_new_posts.py hotdeal_message.py telegram_delivery.py telegram_group_setup.py
          python -m unittest -v test_new_items.py test_naver_cafe_probe.py test_naver_new_posts.py test_hotdeal_message.py test_telegram_delivery.py
      - name: DealSpot first-page scan
        id: dealspot_scan
        continue-on-error: true
        run: |
          if [ "$PREVIEW" = "true" ]; then
            python new_items.py --preview
          else
            python new_items.py
          fi
      - name: Naver Cafe first-page scan (public metadata)
        id: naver_scan
        continue-on-error: true
        run: |
          if [ "$PREVIEW" = "true" ]; then
            python naver_new_posts.py --preview
          else
            python naver_new_posts.py
          fi
      # Save both histories even if one scanner failed after sending some messages.
      # This avoids redelivering successful messages at the next scheduled scan.
      - name: Persist both alert histories
        if: ${{ !cancelled() && steps.checks.outcome == 'success' && (github.event_name == 'schedule' || !inputs.preview) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for state in state/seen_products.json state/naver_seen_articles.json; do
            if [ -f "$state" ]; then
              git add -- "$state"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist hotdeal alert histories [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      # continue-on-error isolates sources but this final step preserves error visibility.
      - name: Check both scan results
        if: ${{ !cancelled() && steps.checks.outcome == 'success' }}
        env:
          DEALSPOT_RESULT: ${{ steps.dealspot_scan.outcome }}
          NAVER_RESULT: ${{ steps.naver_scan.outcome }}
        run: |
          echo "DealSpot result: $DEALSPOT_RESULT"
          echo "Naver result: $NAVER_RESULT"
          if [ "$DEALSPOT_RESULT" != "success" ] || [ "$NAVER_RESULT" != "success" ]; then
            echo "::error::At least one source failed. Other source was still scanned, and successful alert histories were persisted."
            exit 1
          fi
