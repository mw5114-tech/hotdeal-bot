name: Tests | Fallcent similar product displayed current fallback
on:
  push:
    branches: [feat/fallcent-similar-current-fallback-20261117, feat/fallcent-similar-relative-percent-20261117, main]
    paths:
      - gh_only/fallcent_similar_current.py
      - gh_only/default_deal_automation.py
      - gh_only/default_deal_format.py
      - gh_only/naver_blog_format.py
      - gh_only/jirum_manual_queue.py
      - gh_only/daangn_editor_probe.py
      - gh_only/test_fallcent_similar_current.py
      - .github/workflows/naver-blog-auto-main.yml
      - .github/workflows/daangn-cafe-restored.yml
      - .github/workflows/fallcent-similar-current-tests.yml
permissions:
  contents: read
jobs:
  offline-no-post:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only offline import requirements
        run: python -m pip install --quiet --disable-pip-version-check playwright==1.64.1 Pillow==11.3.0
      - name: Compile and verify all affected Naver + Daangn price and evidence guards
        run: |
          python -m compileall -q gh_only/fallcent_similar_current.py gh_only/default_deal_automation.py gh_only/default_deal_format.py gh_only/naver_blog_format.py gh_only/jirum_manual_queue.py gh_only/test_fallcent_similar_current.py
          python -m unittest -v \
            gh_only.test_fallcent_similar_current \
            gh_only.test_fallcent_search_photo \
            gh_only.test_fallcent_high_reference \
            gh_only.test_default_deal_automation \
            gh_only.test_default_deal_format \
            gh_only.test_naver_blog_format \
            gh_only.test_naver_blog_jirum \
            gh_only.test_jirum_manual_queue \
            gh_only.test_daangn_editor_probe \
            gh_only.test_coupang_no_subid_end_to_end
