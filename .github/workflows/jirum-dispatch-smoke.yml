name: Jirum | GitHub dispatch smoke (NO CAFE POST)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'manual/trigger-jirum-dispatch-smoke.txt'

permissions:
  actions: write
  contents: read

jobs:
  test-dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Feed a synthetic RAW_MODE Coupang event into the real bridge
        env:
          GH_DISPATCH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path
          import tempfile
          from live_store import Store
          from jirum_github_dispatch import (
              GitHubEventBridge, workflow_dispatch, LAST_ACK_ID_KEY,
              PENDING_KEY,
          )

          with tempfile.TemporaryDirectory() as folder:
              store = Store(Path(folder) / "test-bridge.sqlite3")
              try:
                  store.initialize(100, [("personal", "123"), ("group", "-456")])
                  now = [10000.]
                  bridge = GitHubEventBridge(
                      store, __import__("os").environ["GH_DISPATCH_TOKEN"],
                      clock=lambda: now[0],
                      sender=lambda token: workflow_dispatch(token, smoke_test=True),
                  )
                  # Actual RAW_MODE shape includes text and hidden entity URL.
                  synthetic = {"id": 101, "text": "쿠팡 새 딜 구매하기",
                               "entities": [{
                                   "type": "text_link",
                                   "url": "https://link.coupang.com/a/safe-smoke",
                               }]}
                  assert bridge.observe(synthetic)
                  now[0] += 21
                  assert asyncio.run(bridge.process_once())
                  # A GitHub HTTP denial leaves the pending event intact.
                  assert store.get(LAST_ACK_ID_KEY) == 101, "HTTP dispatch not accepted"
                  assert store.get(PENDING_KEY) == 0, "Pending signal not checkpointed"
                  print("RAW_BRIDGE_REAL_GITHUB_API_DISPATCH_ACCEPTED_SAFE_SMOKE")
              finally:
                  store.close()
          PY
