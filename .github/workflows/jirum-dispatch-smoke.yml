name: Jirum | GitHub dispatch smoke (NO CAFE POST)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'manual/trigger-jirum-dispatch-smoke.txt'

permissions:
  actions: write
  contents: read

jobs:
  test-dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Use GitHub API to dispatch the production workflow in SAFE smoke mode
        env:
          GH_DISPATCH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib import request

          repo = os.environ["GITHUB_REPOSITORY"]
          # The only permitted target is the existing FIFO workflow's read-only
          # smoke job. The real drain job is explicitly skipped for this input.
          url = (f"https://api.github.com/repos/{repo}/actions/workflows/"
                 "daangn-jirum-manual-fifo.yml/dispatches")
          body = json.dumps({
              "ref": "main",
              "inputs": {"smoke_test": "true"},
          }).encode("utf-8")
          req = request.Request(url, data=body, method="POST", headers={
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_DISPATCH_TOKEN"],
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "JirumSafeDispatchSmoke/1.0",
          })
          with request.urlopen(req, timeout=22) as resp:
              status = resp.status
          assert status == 204, f"Unexpected dispatch status: {status}"
          print("GITHUB_DISPATCH_HTTP_204_ACCEPTED_SAFE_SMOKE_ONLY")
          PY
