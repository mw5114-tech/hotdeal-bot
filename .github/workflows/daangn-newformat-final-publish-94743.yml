name: FINAL one-time post selected 94743 new format (verified photo first)
on:
  push:
    branches:
      - test/daangn-new-format-one-post-20261101
    paths:
      - .github/workflows/daangn-newformat-final-publish-94743.yml
permissions:
  contents: read
concurrency:
  group: source-94743-final-publication-once
  cancel-in-progress: false
jobs:
  one-post:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KAKAO_DEV_STORAGE_STATE_JSON: ${{ secrets.KAKAO_DEV_STORAGE_STATE_JSON }}
      DAANGN_CAFE_STORAGE_STATE_JSON: ${{ secrets.DAANGN_CAFE_STORAGE_STATE_JSON }}
      COUPANG_PARTNER_LPTAG: AF9668915
      ALLOW_PINNED_POST_94743: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Rebuild exact previewed product 94743 (exclude older published sources)
        run: |
          python -m gh_only.default_deal_automation --max-source-posts 20 \
            --exclude-source-id 94737 --exclude-source-id 94738 \
            --source-id 94743 --output-dir one-post-draft
      - name: Submit exactly once after tested strict editor checks
        run: python -m gh_only.daangn_newformat_publish_once
      - name: Save single-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daangn-final-94743-post-and-format
          path: |
            daangn-newformat-post/
            one-post-draft/
          if-no-files-found: warn
          retention-days: 1
