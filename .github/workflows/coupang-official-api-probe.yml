name: Tests | Coupang Partners Official Deep Link API (no blog publishing)

on:
  push:
    branches: [main]
    paths:
      - 'gh_only/coupang_partners_api.py'
      - 'gh_only/test_coupang_partners_api.py'
      - '.github/workflows/coupang-official-api-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-and-safe-api-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      COUPANG_PARTNERS_ACCESS_KEY: ${{ secrets.COUPANG_PARTNERS_ACCESS_KEY }}
      COUPANG_PARTNERS_SECRET_KEY: ${{ secrets.COUPANG_PARTNERS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify official API client syntax and response contracts (no network)
        run: |
          python -m py_compile gh_only/coupang_partners_api.py gh_only/test_coupang_partners_api.py
          python -m unittest -v gh_only.test_coupang_partners_api
      - name: Check GitHub API key secrets are configured (do not print keys)
        run: |
          test -n "$COUPANG_PARTNERS_ACCESS_KEY" || { echo 'COUPANG_PARTNERS_ACCESS_KEY_MISSING'; exit 1; }
          test -n "$COUPANG_PARTNERS_SECRET_KEY" || { echo 'COUPANG_PARTNERS_SECRET_KEY_MISSING'; exit 1; }
      - name: Real signed Coupang deeplink API probe - no blog or state write
        run: python -m gh_only.coupang_partners_api
      - name: Verify live official Coupang API for new cafe SUBID (NO PUBLISH)
        run: |
          python - <<'PY'
          from urllib.parse import urlsplit
          from gh_only.coupang_partners_api import request_deeplink, issued_link_url
          sample = "https://www.coupang.com/np/search?q=test"
          url = request_deeplink(sample, subid="cafe")
          assert issued_link_url(url)
          print("COUPANG_CAFE_SUBID_PROBE_OK host=" +
                str(urlsplit(url).hostname) +
                " subid_requested=cafe no_blog_or_cafe_post=true")
          PY
      - name: Verify one fresh Naver product draft end-to-end (no Naver browser or publish)
        env:
          COUPANG_PARTNER_LPTAG: AF9668915
          COUPANG_PARTNER_SUBID: naverblog
          JIRUM_IMAGE_SOURCE: lowchart
          JIRUM_ENABLE_NAVER_PRICE_FALLBACK: 'false'
          JIRUM_REQUIRE_OFFICIAL_PARTNERS_LINK: 'false'
          JIRUM_PUBLISH_BEFORE_MUSE_REWRITE: 'false'
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.64.1
          python - <<'PY'
          import json, tempfile
          from pathlib import Path
          from urllib.parse import urlsplit
          from gh_only.naver_blog_jirum import make_article, source_fresh
          from gh_only.coupang_partners_api import issued_link_url
          state=json.loads(Path("state/naver_blog_jirum_fifo.json").read_text("utf-8"))
          eligible=[s for s in (state.get("pending") or []) if source_fresh(s)]
          if not eligible:
              print("COUPANG_OFFICIAL_NAVER_DRAFT_NO_FRESH_SOURCE_NO_POST")
          else:
              src=eligible[0]
              with tempfile.TemporaryDirectory(prefix="official-naver-draft-") as tmp:
                  article=make_article(src,Path(tmp),tag="AF9668915")
                  assert article["source_id"] == src["source_message_id"]
                  assert issued_link_url(article["link"])
                  assert article["unissued_link"] is False
                  assert article["body"].startswith(
                      "이 포스팅은 쿠팡 파트너스 활동의 일환으로")
                  assert any(block.get("kind")=="affiliate_link"
                             and block.get("link_url")==article["link"]
                             for block in article["blocks"])
                  print("COUPANG_OFFICIAL_NAVER_DRAFT_OK "+json.dumps({
                      "source_id":article["source_id"],
                      "host":urlsplit(article["link"]).hostname,
                      "subid_requested":"naverblog",
                      "no_naver_login_or_post":True,
                  }))
          PY
