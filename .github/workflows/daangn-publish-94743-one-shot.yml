name: One-time Daangn post of Jirum 94743 (new caption format)
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: daangn-94743-new-caption-publish-one-time
  cancel-in-progress: false
jobs:
  publish_exactly_one:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      KAKAO_DEV_STORAGE_STATE_JSON: ${{ secrets.KAKAO_DEV_STORAGE_STATE_JSON }}
      DAANGN_CAFE_STORAGE_STATE_JSON: ${{ secrets.DAANGN_CAFE_STORAGE_STATE_JSON }}
      COUPANG_PARTNER_LPTAG: AF9668915
      ALLOW_ONE_TEST_POST: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Prepare exact Telegram item 94743, requiring photo and price checks
        run: python -m gh_only.default_deal_automation --max-source-posts 20 --source-id 94743 --output-dir one-post-preview
      - name: Publish exactly one post and verify readback, without retries
        run: python -m gh_only.daangn_publish_verified_94743
      - name: Save private posting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daangn-94743-one-shot-result
          path: |
            one-post-preview/
            one-post-test-result/
          retention-days: 1
          if-no-files-found: warn
# Second run: editor diagnostics enabled; still rejects publish on mismatch.
