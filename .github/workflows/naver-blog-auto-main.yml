name: NAVER BLOG | MAIN - Telegram to Blog (Oracle + 6h backup)

on:
  # Oracle's event bridge is the primary trigger.
  workflow_dispatch:
    inputs:
      source_post_id:
        description: 'Oracle Telegram event post ID (optional)'
        required: false
        default: ''
        type: string
      smoke_test:
        description: 'Safe dispatch test: no scan, claim, photo upload or publish'
        required: false
        default: false
        type: boolean
  # The Oracle event bridge remains real-time. Under low Actions budget,
  # run a low-frequency emergency sweep instead of 48 paid empty scans/day.
  # Freshness checks remain unchanged: this is NOT a 6-hour replay of old deals.
  schedule:
    - cron: '17 */6 * * *'
  # The old Oracle deployment may still dispatch to the legacy filename.
  # Its compatibility entrypoint calls this one with the SAME safety flags.
  workflow_call:
    inputs:
      source_post_id:
        required: false
        type: string
        default: ''
      smoke_test:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  smoke-dispatch-only:
    if: github.ref == 'refs/heads/main' && inputs.smoke_test == true
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Confirm no-publish dispatch path
        run: echo 'JIRUM_GITHUB_DISPATCH_SMOKE_OK — NO_SCAN_NO_POST'

  # An Oracle/legacy dispatch forks two independent channel jobs.
  # Scheduled Naver backup must NOT call a nested Daangn workflow:
  # Daangn already has its own :26/:56 backup and invoking nested jobs
  # on schedule caused a 2026-11-11 22:29 KST ghost run failure while
  # the Naver scan itself was green. This prevents duplicate scans and
  # isolates the two backup schedules.
  daangn-cafe-independent:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event_name != 'schedule'
    uses: ./.github/workflows/daangn-cafe-restored.yml
    with:
      source_post_id: ${{ inputs.source_post_id }}
      smoke_test: ${{ inputs.smoke_test }}
    secrets: inherit

  naver-blog-fifo:
    # Independent Naver-only FIFO, with its own job-level serialization.
    # No Daangn scan, state, browser, or publish job runs before this.
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.smoke_test != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: naver-blog-jirum-state-and-publisher
      cancel-in-progress: false
    env:
      GH_STATE_TOKEN: ${{ github.token }}
      NAVER_BLOG_STORAGE_STATE_JSON: ${{ secrets.NAVER_BLOG_STORAGE_STATE_JSON }}
      COUPANG_PARTNERS_ACCESS_KEY: ${{ secrets.COUPANG_PARTNERS_ACCESS_KEY }}
      COUPANG_PARTNERS_SECRET_KEY: ${{ secrets.COUPANG_PARTNERS_SECRET_KEY }}
      # Owner approved live Naver Blog publishing on 2026-11-09.
      # Up to four fresh FIFO items per run, oldest first. New Daangn
      # cafe runs in its independent workflow; legacy cafe stays archived.
      # Every Naver link is now issued by official signed Coupang Partners API;
      # no fallback to an unissued synthetic AFFSDP link if API fails.
      # Owner-authorized auto publish resumed after short-link deduplication
      # passed a real SmartEditor editor check and a live one-shot publish.
      # Naver live auto-post is enabled; owner-requested updated price order
      # verified in GitHub run 42643396146 and published source 95500.
      NAVER_BLOG_PUBLISH_ENABLED: 'true'
      COUPANG_PARTNER_LPTAG: AF9668915
      COUPANG_PARTNER_SUBID: naverblog
      JIRUM_IMAGE_SOURCE: lowchart
      JIRUM_ENABLE_NAVER_PRICE_FALLBACK: 'false'
      JIRUM_REQUIRE_OFFICIAL_PARTNERS_LINK: 'false'
      JIRUM_PUBLISH_BEFORE_MUSE_REWRITE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan fresh Telegram items into separate Naver queue
        id: naver_scan
        run: python -m gh_only.naver_blog_jirum scan
      # Cache only the pinned browser binaries; every fresh eligible deal
      # still performs the normal safety probe before SmartEditor opens.
      - name: Restore reusable Chromium binary (no publishing)
        if: steps.naver_scan.outputs.ready == 'true' && env.NAVER_BLOG_PUBLISH_ENABLED == 'true'
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: headless-shell-linux-x64-playwright-1.64.1-v1
      - name: Install headless Chromium quickly (recover only if required)
        if: steps.naver_scan.outputs.ready == 'true' && env.NAVER_BLOG_PUBLISH_ENABLED == 'true'
        run: |
          # The publisher launches playwright.chromium with headless=True,
          # so the full headed Chromium binary and optional fonts are unnecessary.
          # On ubuntu-24.04, --with-deps previously downloaded 21 MB of fonts
          # and cost roughly 95 seconds per eligible post.
          python -m pip install --disable-pip-version-check --quiet playwright==1.64.1
          python -m playwright install --only-shell chromium

          # No Naver login or publish here: just a local browser launch probe.
          # Preserve the original complete dependency install as a fail-safe
          # if the runner image ever changes or has missing shared libraries.
          if python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'; then
            echo "NAVER_BROWSER_FASTPATH_READY"
          else
            echo "NAVER_BROWSER_MISSING_DEPS_USING_SAFE_FALLBACK"
            python -m playwright install --with-deps --only-shell chromium
            python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'
            echo "NAVER_BROWSER_FALLBACK_READY"
          fi
      - name: Publish oldest Naver FIFO items sequentially (max 4 per run)
        if: steps.naver_scan.outputs.ready == 'true' && env.NAVER_BLOG_PUBLISH_ENABLED == 'true'
        run: python -m gh_only.naver_blog_jirum batch
      - name: Keep public-only Naver draft receipt if available
        if: always() && steps.naver_scan.outputs.ready == 'true' && env.NAVER_BLOG_PUBLISH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: naver-blog-fifo-${{ github.run_id }}
          path: naver-blog-one-draft/
          retention-days: 1
          if-no-files-found: ignore
