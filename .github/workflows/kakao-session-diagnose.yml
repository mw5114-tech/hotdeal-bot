name: Kakao session safe JSON structure diagnosis

on:
  push:
    branches: [test/github-only-pipeline-20261031]
    paths:
      - '.github/workflows/kakao-session-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-off-safe-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      KAKAO_DEV_STORAGE_STATE_JSON: ${{ secrets.KAKAO_DEV_STORAGE_STATE_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Classify failure without printing session data or making browser requests
        run: python gh_only/kakao_session_diagnostic.py

# Classify provider-owned cookie domains safely.
