name: DIAG read-only | recover authorized Telegram replay sources
on:
  push:
    branches: [fix/naver-web-photo-and-user-replay-20261104]
    paths: ['.github/workflows/test-telegram-replay-source-20261104.yml']
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Read original 94986-94990 posts; no state change or posting
        run: |
          python - <<'PY'
          from gh_only.jirum_manual_queue import fetch_exact_source_post
          import json
          for mid in range(94986,94991):
            try:
              row=fetch_exact_source_post(mid)
              out=({k:row.get(k) for k in ("source_message_id","source_text","title","original_purchase_url","sale_price_krw","posted_at_utc")} if row else None)
              print("REPLAY_SOURCE_EVIDENCE",mid,json.dumps(out,ensure_ascii=False))
            except Exception as exc:
              print("REPLAY_SOURCE_ERROR",mid,type(exc).__name__,str(exc)[:100])
          PY
