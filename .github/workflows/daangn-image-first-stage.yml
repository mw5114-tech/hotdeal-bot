name: Stage image-FIRST one new Jirum post (DO NOT PUBLISH)
on:
  push:
    branches:
      - test/daangn-image-first-20261101
    paths:
      - .github/workflows/daangn-image-first-stage.yml
      - gh_only/daangn_image_first_stage.py
permissions:
  contents: read
jobs:
  stage-image-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DAANGN_CAFE_STORAGE_STATE_JSON: ${{ secrets.DAANGN_CAFE_STORAGE_STATE_JSON }}
      KAKAO_DEV_STORAGE_STATE_JSON: ${{ secrets.KAKAO_DEV_STORAGE_STATE_JSON }}
      COUPANG_PARTNER_LPTAG: AF9668915
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Build another product, do not duplicate prior Philips post
        run: python -m gh_only.default_deal_automation --max-source-posts 20 --exclude-source-id 94737 --output-dir jirum-affsdp-drafts
      - name: Upload photo FIRST, then type text and validate exact full href
        run: python -m gh_only.daangn_image_first_stage
      - name: Collect photo and private evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daangn-image-first-stage-20261101
          path: |
            jirum-affsdp-drafts/
            daangn-image-first-check/
          if-no-files-found: warn
          retention-days: 1
