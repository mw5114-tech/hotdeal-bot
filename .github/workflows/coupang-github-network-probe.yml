name: Coupang GitHub-only access diagnosis
on:
  pull_request:
    paths:
      - coupang_github_network_probe.py
      - .github/workflows/coupang-github-network-probe.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coupang-github-access-onepass
  cancel-in-progress: false
jobs:
  one-visit-each:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            browser: chromium
          - runner: windows-latest
            browser: chrome
          - runner: macos-latest
            browser: chromium
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: python -m pip install --disable-pip-version-check playwright==1.64.1
      - name: Install Chromium for Linux/macOS
        if: runner.os != 'Windows'
        run: python -m playwright install chromium
      - name: Install browser dependencies for Linux
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium
      - name: Probe exactly one Python HTTP request and one browser navigation
        run: python coupang_github_network_probe.py --channel "${{ matrix.browser }}"
      - name: Upload sanitised diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupang-github-${{ matrix.runner }}-report
          path: coupang-github-transport-report.json
          retention-days: 3
          if-no-files-found: ignore
