name: Tests | Archived Daangn + Naver split (offline)

on:
  push:
    branches: [main]
    paths:
      - 'gh_only/affsdp_candidate.py'
      - 'gh_only/default_deal_automation.py'
      - 'gh_only/default_deal_format.py'
      - 'gh_only/lowchart_price_reference.py'
      - 'gh_only/test_default_deal_format.py'
      - 'gh_only/test_lowchart_price_reference.py'
      - 'gh_only/fallcent_high_reference.py'
      - 'gh_only/naver_blog_format.py'
      - 'gh_only/test_fallcent_high_reference.py'
      - 'gh_only/test_naver_blog_format.py'
      - 'gh_only/naver_blog_jirum.py'
      - 'gh_only/daangn_editor_probe.py'
      - 'gh_only/naver_blog_deal_publisher.py'
      - 'gh_only/coupang_partners_api.py'
      - 'gh_only/test_coupang_partners_api.py'
      - 'gh_only/test_naver_blog_jirum.py'
      - 'gh_only/naver_blog_latest_manual.py'
      - 'gh_only/test_naver_blog_latest_manual.py'
      - '.github/workflows/naver-blog-manual-latest.yml'
      - 'naver_blog_one_shot.py'
      - 'test_naver_blog_one_shot.py'
      - 'gh_only/jirum_manual_queue.py'
      - 'gh_only/test_affsdp_candidate.py'
      - 'gh_only/test_default_deal_automation.py'
      - 'archive/daangn/daangn-fifo-paused.yml'
      - '.github/workflows/daangn-cafe-restored.yml'
      - 'gh_only/jirum_manual_queue.py'
      - 'gh_only/jirum_manual_publisher.py'
      - 'gh_only/test_jirum_manual_publisher.py'
      - 'gh_only/test_jirum_manual_queue.py'
      - '.github/workflows/naver-blog-auto-main.yml'
      - '.github/workflows/daangn-jirum-manual-fifo.yml'
      - '.github/workflows/daangn-subid-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-subid-regression:
    # 1-vCPU runner charges one-third of the standard Linux per-minute rate.
    # Offline suite only: no Chromium launcher/editor/live publisher here.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight Playwright Python import dependency
        run: python -m pip install --disable-pip-version-check --quiet playwright==1.64.1
      - name: Compile modified Python modules
        run: python -m py_compile gh_only/default_deal_format.py gh_only/lowchart_price_reference.py gh_only/naver_blog_format.py gh_only/affsdp_candidate.py gh_only/default_deal_automation.py gh_only/jirum_manual_queue.py gh_only/naver_blog_jirum.py gh_only/test_naver_blog_jirum.py naver_blog_one_shot.py test_naver_blog_one_shot.py gh_only/test_affsdp_candidate.py gh_only/test_default_deal_automation.py
      - name: Run link-generation, photo/price, and Naver display tests (offline)
        run: |
          python -m unittest -v gh_only.test_affsdp_candidate gh_only.test_default_deal_format gh_only.test_lowchart_price_reference gh_only.test_default_deal_automation gh_only.test_fallcent_high_reference gh_only.test_naver_blog_format gh_only.test_naver_blog_jirum gh_only.test_coupang_partners_api gh_only.test_jirum_manual_queue gh_only.test_jirum_manual_publisher gh_only.test_naver_blog_latest_manual test_naver_blog_one_shot
      - name: Verify production environment uses own lptag and dedicated SubID
        run: |
          python - <<'PY'
          from pathlib import Path
          archived = Path('archive/daangn/daangn-fifo-paused.yml').read_text()
          main = Path('.github/workflows/naver-blog-auto-main.yml').read_text()
          legacy = Path('.github/workflows/daangn-jirum-manual-fifo.yml').read_text()
          assert 'COUPANG_PARTNER_LPTAG: AF9668915' in archived
          assert 'COUPANG_PARTNER_SUBID: daangncafe' in archived
          assert "DAANGN_PUBLISH_PAUSED: 'true'" in archived
          assert 'COUPANG_PARTNER_LPTAG: AF4625512' not in archived
          assert 'COUPANG_PARTNER_LPTAG: AF9668915' in main
          assert 'COUPANG_PARTNER_SUBID: naverblog' in main
          assert 'COUPANG_PARTNERS_ACCESS_KEY: ' in main
          assert 'COUPANG_PARTNERS_SECRET_KEY: ' in main
          assert 'secrets.COUPANG_PARTNERS_ACCESS_KEY' in main
          assert 'secrets.COUPANG_PARTNERS_SECRET_KEY' in main
          assert 'apply_official_api_link' in Path('gh_only/naver_blog_jirum.py').read_text()
          assert 'python -m gh_only.naver_blog_jirum batch' in main
          assert 'MAX_BATCH_POSTS = 4' in Path('gh_only/naver_blog_jirum.py').read_text()
          restored = Path('.github/workflows/daangn-cafe-restored.yml').read_text()
          assert 'https://cafe.daangn.com/kupang-teuggaye' in restored
          assert "DAANGN_PUBLISH_PAUSED: 'false'" in restored
          assert "DAANGN_CAFE_PUBLISH_ENABLED: 'true'" in restored
          assert "DAANGN_CAFE_PARTNERS_PERMISSION_CONFIRMED: 'true'" in restored
          assert 'COUPANG_PARTNER_SUBID: cafe' in restored
          assert 'python -m gh_only.jirum_manual_queue scan' in restored
          assert 'python -m gh_only.jirum_manual_queue drain' in restored
          assert "uses: ./.github/workflows/daangn-cafe-restored.yml" in main
          assert 'daangn-cafe-independent:' in main
          assert "github.event_name != 'schedule'" in main
          assert "cron: '17 */6 * * *'" in main
          assert "cron: '47 */6 * * *'" in restored
          assert "runs-on: ubuntu-slim" in Path('.github/workflows/daangn-subid-regression.yml').read_text()
          assert "runs-on: ubuntu-24.04" in main
          assert "runs-on: ubuntu-24.04" in restored
          assert 'headless-shell-linux-x64-playwright-1.64.1-v1' in main
          assert 'headless-shell-linux-x64-playwright-1.64.1-v1' in restored
          assert 'uses: actions/cache@v4' in main
          assert 'uses: actions/cache@v4' in restored
          assert 'secrets: inherit' in main
          assert 'DAANGN_POLICY_GATE_CLOSED_SCAN_ONLY' in restored
          assert "DAANGN_PUBLISH_PAUSED" not in main
          assert 'python -m gh_only.jirum_manual_queue drain' not in main
          assert 'needs: drain-backlog' not in main
          assert 'uses: ./.github/workflows/naver-blog-auto-main.yml' in legacy
          assert 'python -m gh_only.jirum_manual_queue drain' not in legacy
          print('ARCHIVED_DAANGN_AND_NAVER_ONLY_MAIN_CONFIG_VALID')
          PY
