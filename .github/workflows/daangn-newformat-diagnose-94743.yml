name: Dry-run diagnose Jirum 94743 new-format text after photo
on:
  push:
    branches:
      - test/daangn-new-format-one-post-20261101
    paths:
      - .github/workflows/daangn-newformat-diagnose-94743.yml
      - gh_only/daangn_newformat_publish_once.py
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KAKAO_DEV_STORAGE_STATE_JSON: ${{ secrets.KAKAO_DEV_STORAGE_STATE_JSON }}
      DAANGN_CAFE_STORAGE_STATE_JSON: ${{ secrets.DAANGN_CAFE_STORAGE_STATE_JSON }}
      COUPANG_PARTNER_LPTAG: AF9668915
      ALLOW_PINNED_POST_94743: 'true'
      ONEPOST_DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check playwright==1.64.1
          python -m playwright install --with-deps chromium
      - run: |
          python -m gh_only.default_deal_automation --max-source-posts 20 \
            --exclude-source-id 94737 --exclude-source-id 94738 \
            --source-id 94743 --output-dir one-post-draft
      - name: Test editor only, never click publish
        run: python -m gh_only.daangn_newformat_publish_once
      - name: Save private diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daangn-94743-text-dry-run
          path: daangn-newformat-post/
          retention-days: 1
          if-no-files-found: warn
