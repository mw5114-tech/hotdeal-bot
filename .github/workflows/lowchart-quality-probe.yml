name: Probe | Lowchart native image vs browser screenshot (no publishing)
on:
  push:
    branches: [fix/lowchart-pale-screenshot-20261115]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only browser and image inspection tools
        run: |
          python -m pip install --quiet --disable-pip-version-check playwright==1.64.1 Pillow
          python -m playwright install --only-shell chromium
      - name: Offline guard regression (no public publishing)
        run: |
          python -m compileall -q gh_only/lowchart_chart_capture.py gh_only/naver_blog_deal_publisher.py gh_only/jirum_manual_publisher.py
          python -m unittest -v gh_only.test_lowchart_chart_capture gh_only.test_naver_blog_format gh_only.test_jirum_manual_publisher
      - name: Check DOM opacity, natural source and screenshots per exact item
        run: |
          python - <<'PY'
          import io, json, math
          from pathlib import Path
          from urllib.parse import urlsplit
          from PIL import Image,ImageStat
          from playwright.sync_api import sync_playwright
          from gh_only.lowchart_chart_capture import chart_bounds
          root=Path("lowchart-chart-quality-probe")
          root.mkdir(exist_ok=True)
          def metrics(data):
              im=Image.open(io.BytesIO(data)).convert("RGB")
              pix=im.resize((240,80))
              vals=list(pix.getdata())
              lumin=[round(.2126*r+.7152*g+.0722*b) for r,g,b in vals]
              # Average contrast and count of nearly-white pixels
              avg=sum(lumin)/len(lumin)
              std=(sum((v-avg)**2 for v in lumin)/len(lumin))**.5
              return {"width":im.width,"height":im.height,"bytes":len(data),
               "gray_mean":round(avg,1),"gray_std":round(std,1),
               "pct_gt235":round(sum(v>235 for v in lumin)/len(lumin),3),
               "pct_lt130":round(sum(v<130 for v in lumin)/len(lumin),3)}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for pid,iid in [("7098352204","19148341413"),("1487703230","2554295884")]:
                  ctx=browser.new_context(locale="ko-KR",viewport={"width":1180,"height":950},device_scale_factor=2)
                  page=ctx.new_page()
                  url=f"https://www.lowchart.com/{pid}-{iid}"
                  res=page.goto(url,wait_until="domcontentloaded",timeout=22000)
                  page.get_by_role("button",name="차트 퍼가기").wait_for(state="visible",timeout=9000)
                  page.wait_for_timeout(600)
                  page.get_by_role("button",name="차트 퍼가기").scroll_into_view_if_needed(timeout=5000)
                  page.wait_for_timeout(1100)
                  imgrows=page.evaluate("""() => [...document.querySelectorAll('img')].map((e,i)=>({
                    index:i,src:e.currentSrc||e.src,alt:e.alt||'',width:e.getBoundingClientRect().width,
                    height:e.getBoundingClientRect().height,naturalWidth:e.naturalWidth,complete:e.complete
                  })).filter(x=>x.width>390 || x.naturalWidth>600).slice(0,25)""")
                  print("LOWCHART_VISIBLE_IMAGES",json.dumps({"ids":[pid,iid],"images":imgrows},ensure_ascii=False))
                  viable=[x for x in imgrows if x["width"]>=390 and x["height"]>=170 and
                    str(pid) in x["src"] and str(iid) in x["src"]]
                  if len(viable)!=1:
                      print("LOWCHART_IMAGE_MISSING",pid,iid,len(viable))
                      continue
                  img=page.locator('img').nth(viable[0]["index"])
                  img.wait_for(state="visible",timeout=7000)
                  data=img.evaluate("""el=>{
                    const css = n=>{const s=getComputedStyle(n);return {tag:n.tagName,
                      cls:String(n.className||'').slice(0,80),opacity:s.opacity,
                      filter:s.filter,visibility:s.visibility,animation:s.animationName,
                      transition:s.transition,background:s.backgroundColor,
                      objectFit:s.objectFit}};
                    let chain=[],n=el;
                    while(n&&chain.length<7){chain.push(css(n));n=n.parentElement}
                    return {src:el.currentSrc,naturalWidth:el.naturalWidth,
                      naturalHeight:el.naturalHeight,complete:el.complete,
                      bounds:el.getBoundingClientRect().toJSON(),chain};
                  }""")
                  print("LOWCHART_DOM",json.dumps({"productId":pid,"itemId":iid,**data},ensure_ascii=False))
                  src=data["src"]
                  u=urlsplit(src)
                  if (u.hostname!="chart.lowchart.com" or
                      u.path!=f"/{pid}-{iid}.png" or u.query):
                      print("UNEXPECTED_CHART_SOURCE",u.hostname,u.path)
                      raise SystemExit(1)
                  image_response=ctx.request.get(src,timeout=18000)
                  assert image_response.ok
                  native=image_response.body()
                  browser_png=img.screenshot(type="png",timeout=10000)
                  bounds=chart_bounds(page)
                  original_clip=page.screenshot(type="jpeg",quality=78,clip=bounds,timeout=10000)
                  import os
                  from gh_only.lowchart_chart_capture import capture_chart_image, _inspect_native_png
                  os.environ["JIRUM_LOWCHART_CHART_IMAGE_ENABLED"]="true"
                  new_path=capture_chart_image(browser,{"product_id":pid,"item_id":iid},root,
                    95999 if pid=="7098352204" else 96004)
                  assert new_path is not None and new_path.suffix==".png", "NEW_CAPTURE_MUST_VERIFY_NATIVE_PNG"
                  assert new_path.read_bytes()==native, "NEW_CAPTURE_BYTES_MUST_EQUAL_ORIGINAL"
                  assert _inspect_native_png(new_path.read_bytes()) is not None
                  print("LOWCHART_NEW_NATIVE_CAPTURE_OK",json.dumps({"ids":[pid,iid],
                    "output":new_path.name,"bytes":new_path.stat().st_size},ensure_ascii=False))
                  print("LOWCHART_IMAGE_COMPARE",json.dumps({"ids":[pid,iid],
                    "native":metrics(native),"browser_element":metrics(browser_png),
                    "old_jpeg":metrics(original_clip),"bounds":bounds},ensure_ascii=False))
                  for kind,dat,ext in [("native",native,"png"),("browser",browser_png,"png"),("old",original_clip,"jpg")]:
                      (root/f"{pid}-{iid}_{kind}.{ext}").write_bytes(dat)
                  ctx.close()
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lowchart-quality-probe-samples
          path: lowchart-chart-quality-probe/
          if-no-files-found: ignore
          retention-days: 1
