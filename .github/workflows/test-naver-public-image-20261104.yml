name: Test | Naver public image search (read only)
on:
  push:
    branches: [diagnose/naver-public-image-search-20261104]
    paths: ['.github/workflows/test-naver-public-image-20261104.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test normal PC/mobile Naver image webpages without API or login
        run: |
          python - <<'PY'
          import re,json
          from urllib import request,parse,error
          q="삼성전자 4K UHD QLED TV KQ85QF6AAFXKR"
          urls=[
            "https://search.naver.com/search.naver?where=image&query="+parse.quote(q),
            "https://m.search.naver.com/search.naver?where=m_image&query="+parse.quote(q),
            "https://m.search.naver.com/search.naver?where=image&query="+parse.quote(q),
            "https://imagesearch.naver.com/search.naver?where=image&query="+parse.quote(q),
            "https://search.naver.com/search.naver?query="+parse.quote(q),
          ]
          for u in urls:
            req=request.Request(u,headers={
                "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36",
                "Accept":"text/html,application/xhtml+xml",
                "Accept-Language":"ko-KR,ko;q=0.9",
            })
            try:
                with request.urlopen(req,timeout=13) as resp:
                    body=resp.read(600000).decode("utf-8","replace")
                    print("IMAGE_SEARCH_RESULT",json.dumps({
                        "host":parse.urlsplit(u).hostname,"where":parse.parse_qs(parse.urlsplit(u).query).get("where"),
                        "status":resp.status,"final_host":parse.urlsplit(resp.geturl()).hostname,
                        "size":len(body),"has_product":"KQ85QF6AAFXKR" in body,
                        "has_img_search":"image" in body.lower(),
                        "has_thumbnail":"pstatic.net" in body,
                        "title":re.findall(r"<title[^>]*>(.*?)</title>",body,re.I|re.S)[:1],
                    },ensure_ascii=False))
            except Exception as exc:
                print("IMAGE_SEARCH_ERROR",json.dumps({
                    "host":parse.urlsplit(u).hostname,
                    "where":parse.parse_qs(parse.urlsplit(u).query).get("where"),
                    "error":type(exc).__name__,"status":getattr(exc,"code",None)},ensure_ascii=False))
          PY
      - name: Test normal Chromium image search webpage without API or login
        run: |
          python -m pip install -q playwright==1.64.1
          python -m playwright install chromium >/dev/null
          python - <<'PY'
          from urllib.parse import quote,urlsplit
          from playwright.sync_api import sync_playwright
          import json
          q="삼성전자 4K UHD QLED TV KQ85QF6AAFXKR"
          urls=[
            "https://search.naver.com/search.naver?where=image&query="+quote(q),
            "https://m.search.naver.com/search.naver?where=m_image&query="+quote(q)
          ]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            page=browser.new_page(locale="ko-KR",viewport={"width":1280,"height":820})
            for u in urls:
                try:
                    r=page.goto(u,wait_until="domcontentloaded",timeout=18000)
                    page.wait_for_timeout(2000)
                    t=page.title()
                    images=page.locator('img').count()
                    print("IMAGE_BROWSER_RESULT",json.dumps({
                        "host":urlsplit(u).hostname,"status":r.status if r else None,
                        "final_host":urlsplit(page.url).hostname,"title":t[:100],
                        "image_count":images,"html_length":len(page.content()),
                        "has_product":q in page.content(),
                        "has_indexed_images":"pstatic.net" in page.content(),
                    },ensure_ascii=False))
                except Exception as exc:
                    print("IMAGE_BROWSER_ERROR",type(exc).__name__,str(exc)[:180])
            browser.close()
          PY

      - name: Inspect first Naver result images and test allowed direct file retrieval
        run: |
          python -m pip install -q playwright==1.64.1
          python -m playwright install chromium >/dev/null
          python - <<'PY'
          from urllib.parse import quote, urlsplit
          from urllib import request
          from playwright.sync_api import sync_playwright
          import json
          q="삼성전자 4K UHD QLED TV KQ85QF6AAFXKR"
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            page=b.new_page(locale="ko-KR",viewport={"width":1280,"height":820})
            r=page.goto("https://m.search.naver.com/search.naver?where=m_image&query="+quote(q),wait_until="domcontentloaded",timeout=16000)
            page.wait_for_timeout(2300)
            rows=page.locator("img").evaluate_all("""els => els.slice(0,35).map((e,i)=>({
              i, src:(e.currentSrc||e.getAttribute('src')||'').slice(0,260),
              alt:(e.getAttribute('alt')||'').slice(0,110),
              className:String(e.className).slice(0,90),
              parentClass:String(e.parentElement?.className||'').slice(0,90),
              href:(e.closest('a')?.href||'').slice(0,130),
              width:e.naturalWidth,height:e.naturalHeight
            }))""")
            print("NAVER_IMAGE_PAGE",r.status if r else None,page.title(),len(rows))
            for x in rows[:28]:print("NAVER_IMAGE_NODE",json.dumps(x,ensure_ascii=False))
            candidates=[x for x in rows if x['src'].startswith('https://') and
                        ('pstatic.net' in x['src'] or 'naver' in x['src']) and
                        x['width']>=100 and x['height']>=100]
            print("NAVER_IMAGE_VALID_CANDIDATES",len(candidates))
            if candidates:
              u=candidates[0]['src']
              try:
                req=request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept':'image/*'})
                with request.urlopen(req,timeout=15) as resp:
                  data=resp.read(3000000)
                  print("NAVER_IMAGE_FETCH",resp.status,resp.headers.get('Content-Type'),len(data),data[:12].hex(),urlsplit(resp.geturl()).hostname)
              except Exception as exc:
                print("NAVER_IMAGE_FETCH_FAILED",type(exc).__name__,getattr(exc,'code',None))
            b.close()
          PY
