name: Validate Jirum repost parser and Telegram payload
# Includes regression coverage: manual verify followed by first scheduled run must not duplicate.

on:
  push:
    branches:
      - main
    paths:
      - jirum_forward.py
      - test_jirum_forward.py
      - test_telegram_delivery.py
      - test_coupang_manual_links.py
      - coupang_manual_links.py
      - coupang_browser_probe.py
      - test_coupang_browser_probe.py
      - config/coupang_manual_links.json
      - .github/workflows/jirum-forward.yml
      - .github/workflows/validate-jirum.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Jirum repost unit tests (no Telegram message sent)
        run: |
          python -m py_compile jirum_forward.py telegram_delivery.py telegram_group_setup.py coupang_manual_links.py coupang_browser_probe.py
          python -m unittest -v test_jirum_forward.py test_telegram_delivery.py test_coupang_manual_links.py test_coupang_browser_probe.py
      - name: Verify live public Jirum posts contain purchase URLs (read only)
        run: |
          python - <<'PY'
          import jirum_forward as app
          posts = app.fetch_listing()
          linked = [p for p in posts if p["product_url"]]
          print(f"JIRUM_PUBLIC_HTML: total={len(posts)} with_purchase_urls={len(linked)}")
          if not linked:
              raise RuntimeError("No purchase links found on live public page")
          for p in linked[-3:]:
              from urllib.parse import urlsplit
              print(f"PUBLIC_LINK_OK: id={p['id']} domain={urlsplit(p['product_url']).hostname}")
          PY
