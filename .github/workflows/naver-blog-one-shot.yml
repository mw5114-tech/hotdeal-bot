name: Naver Blog | one post authorized test (MANUAL / ONE-SHOT)

on:
  pull_request:
    paths:
      - 'naver_blog_one_shot.py'
      - 'test_naver_blog_one_shot.py'
      - '.github/workflows/naver-blog-one-shot.yml'
  workflow_dispatch:
    inputs:
      phase:
        description: 'probe = editor only, draft = fill without publishing, publish = ONE test post'
        required: true
        default: probe
        type: choice
        options: [probe, draft, publish]
  push:
    branches: [main]
    paths:
      - 'manual/trigger-naver-blog-test.txt'

permissions:
  contents: read

concurrency:
  group: naver-blog-owner-one-shot
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline tests only (no network/login/publishing)
        run: |
          python -m py_compile naver_blog_one_shot.py
          python -m unittest -v test_naver_blog_one_shot.py

  one-shot:
    if: github.event_name != 'pull_request'
    needs: offline-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NAVER_BLOG_STORAGE_STATE_JSON: ${{ secrets.NAVER_BLOG_STORAGE_STATE_JSON }}
      TEST_PHASE: ${{ github.event_name == 'push' && 'publish' || inputs.phase }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check that owner supplied private Naver session; never echo secret
        run: |
          python -c "import os,sys; ok=bool(os.environ.get('NAVER_BLOG_STORAGE_STATE_JSON', '').strip()); print('NAVER_AUTH_SECRET_PRESENT' if ok else 'AUTH_SESSION_MISSING_NEEDS_OWNER_LOGIN'); sys.exit(0 if ok else 3)"
      - name: Install browser only after session is available
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Run selected one-shot phase
        run: python naver_blog_one_shot.py --phase "$TEST_PHASE"

# No cron, no Telegram/Oracle changes, no passwords, no session artifacts.
# Only dedicated trigger-file pushes run publish automatically.
