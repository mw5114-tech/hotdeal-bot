name: Naver Blog - One shot authorized test

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'probe = read editor; draft = fill; publish = one test post'
        required: true
        default: probe
        type: choice
        options: [probe, draft, publish]

permissions:
  contents: read

concurrency:
  group: naver-blog-owner-one-shot
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline validation only
        run: |
          python -m py_compile naver_blog_one_shot.py
          python -m unittest -v test_naver_blog_one_shot.py

  one-shot:
    needs: offline-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NAVER_BLOG_STORAGE_STATE_JSON: ${{ secrets.NAVER_BLOG_STORAGE_STATE_JSON }}
      TEST_PHASE: ${{ inputs.phase }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate that owner supplied private Naver session
        run: |
          python -c "import os,sys; ok=bool(os.environ.get('NAVER_BLOG_STORAGE_STATE_JSON', '').strip()); print('NAVER_AUTH_SECRET_PRESENT' if ok else 'AUTH_SESSION_MISSING_NEEDS_OWNER_LOGIN'); sys.exit(0 if ok else 3)"
      - name: Install Playwright browser after session validation
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Run selected single test phase
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            PHASE="$(python -c "from pathlib import Path; print(next((l.split('=',1)[1] for l in Path('manual/trigger-naver-blog-test.txt').read_text().splitlines() if l.startswith('phase=')), ''))")"
          else
            PHASE="$TEST_PHASE"
          fi
          case "$PHASE" in probe|draft|publish) ;; *) echo "INVALID_TEST_PHASE"; exit 2 ;; esac
          echo "ONE_SHOT_PHASE=$PHASE"
          python naver_blog_one_shot.py --phase "$PHASE"

# No cron, Telegram/Oracle changes, automatic retries, or stored login artifacts.
# Manual workflow_dispatch only; no push-triggered or scheduled reposts.
