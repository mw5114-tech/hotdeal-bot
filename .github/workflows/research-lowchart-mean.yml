name: Diagnose exact Lowchart mean selection, no post
on:
  push:
    branches:
      - feat/daangn-caption-lowchart-disclosure-last-20261101
    paths:
      - .github/workflows/research-lowchart-mean.yml
      - gh_only/default_deal_format.py
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      KAKAO_DEV_STORAGE_STATE_JSON: ${{ secrets.KAKAO_DEV_STORAGE_STATE_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check playwright==1.64.1
          python -m playwright install --with-deps chromium
      - run: python -m research.lowchart_94738_diagnose
