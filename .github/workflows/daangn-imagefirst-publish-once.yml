name: PUBLISH ONCE image-first verified Jirum 94738 to own Hotdeal
on:
  push:
    branches:
      - test/daangn-image-first-20261101
    paths:
      - .github/workflows/daangn-imagefirst-publish-once.yml
permissions:
  contents: read
concurrency:
  group: only-one-daangn-source-94738-imagefirst
  cancel-in-progress: false
jobs:
  post-94738-once:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      KAKAO_DEV_STORAGE_STATE_JSON: ${{ secrets.KAKAO_DEV_STORAGE_STATE_JSON }}
      DAANGN_CAFE_STORAGE_STATE_JSON: ${{ secrets.DAANGN_CAFE_STORAGE_STATE_JSON }}
      COUPANG_PARTNER_LPTAG: AF9668915
      ALLOW_ONE_NEW_IMAGE_FIRST_POST: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium for one explicit publish
        run: |
          python -m pip install --disable-pip-version-check playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Generate exactly inspected Jirum 94738 (exclude already-published 94737)
        run: python -m gh_only.default_deal_automation --max-source-posts 20 --exclude-source-id 94737 --source-id 94738 --output-dir jirum-affsdp-drafts
      - name: Insert photo before all text and submit once only if full source URL contiguous
        run: python -m gh_only.daangn_image_first_publish_once
      - name: Save verification record and private screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daangn-one-published-imagefirst-94738
          path: |
            daangn-image-first-check/
            jirum-affsdp-drafts/
          if-no-files-found: warn
          retention-days: 1
