name: One-time repost of last cheddar deal

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-cheddar-repost.yml

permissions:
  contents: read

jobs:
  resend-last-cheddar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Send last cheddar product to personal chat and MUSE group exactly once
        run: |
          python - <<'PY'
          import jirum_forward as app
          from urllib import request
          from urllib.parse import urlsplit

          # Confirm exact most recently delivered source ID from state.
          previous = app.load()
          if previous is None or previous["last_seen_id"] != 94635:
              raise RuntimeError("Latest recorded Jirum ID is not 94635; no test sent")
          posts = app.fetch_listing()
          matching = [post for post in posts if post["id"] == 94635]
          if not matching:
              url = app.PUBLIC_URL + "?before=94636"
              req = request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "text/html",
              })
              with request.urlopen(req, timeout=20) as response:
                  if urlsplit(response.geturl()).hostname != "t.me":
                      raise RuntimeError("Unexpected redirect; no message sent")
                  body = response.read(2000001)
              if len(body) > 2000000:
                  raise RuntimeError("Oversized listing; no message sent")
              posts = app.parse_listing(body.decode("utf-8-sig", "replace"))
              matching = [post for post in posts if post["id"] == 94635]
          if len(matching) != 1:
              raise RuntimeError("Unable to locate exact posted Jirum message 94635")
          deal = matching[0]
          if not deal["product_url"]:
              raise RuntimeError("Cheddar deal has no purchase URL; no message sent")
          if not any(t in deal["text"].lower() for t in ("체다", "cheddar")):
              raise RuntimeError("Post 94635 did not match cheddar, so no message sent: " + deal["title"][:100])
          print("CHEESE_MATCHED: id=94635 title=" + deal["title"][:100])
          app.send_post(deal)
          print("CHEESE_RESENT_ONCE: id=94635 checkpoint_unchanged=true")
          PY
