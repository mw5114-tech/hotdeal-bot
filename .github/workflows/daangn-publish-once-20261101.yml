name: PUBLISH ONCE inspected Jirum 94737 to own Daangn Hotdeal board
on:
  push:
    branches:
      - test/daangn-onepost-20261101
    paths:
      - .github/workflows/daangn-publish-once-20261101.yml
permissions:
  contents: read
concurrency:
  group: daangn-post-94737-publish-once
  cancel-in-progress: false
jobs:
  one_post:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      KAKAO_DEV_STORAGE_STATE_JSON: ${{ secrets.KAKAO_DEV_STORAGE_STATE_JSON }}
      DAANGN_CAFE_STORAGE_STATE_JSON: ${{ secrets.DAANGN_CAFE_STORAGE_STATE_JSON }}
      COUPANG_PARTNER_LPTAG: AF9668915
      ALLOW_ONE_TEST_POST: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install single-session Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Rebuild exactly inspected Jirum deal
        run: python -m gh_only.default_deal_automation --max-source-posts 8 --output-dir jirum-affsdp-drafts
      - name: Publish one exact article with picture, category and owner link, never retry
        run: python -m gh_only.daangn_publish_one
      - name: Save one-time posting evidence for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daangn-one-test-post-94737-result
          path: |
            daangn-post-test/
            jirum-affsdp-drafts/
          if-no-files-found: warn
          retention-days: 1
