name: Stage exactly one Jirum deal with image in own Daangn Cafe (NO POST)
on:
  push:
    branches:
      - test/daangn-onepost-20261101
    paths:
      - .github/workflows/daangn-onepost-stage.yml
      - gh_only/daangn_stage_one.py
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      KAKAO_DEV_STORAGE_STATE_JSON: ${{ secrets.KAKAO_DEV_STORAGE_STATE_JSON }}
      DAANGN_CAFE_STORAGE_STATE_JSON: ${{ secrets.DAANGN_CAFE_STORAGE_STATE_JSON }}
      COUPANG_PARTNER_LPTAG: AF9668915
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Generate latest Coupang deal photo, prices, owner candidate URL
        run: python -m gh_only.default_deal_automation --max-source-posts 8 --output-dir jirum-affsdp-drafts
      - name: Stage one article in confirmed Daangn board, do NOT click submit
        run: python -m gh_only.daangn_stage_one
      - name: Store temporary private evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daangn-own-cafe-stage-one-no-publish
          path: |
            daangn-post-test/
            jirum-affsdp-drafts/
          if-no-files-found: warn
          retention-days: 1
