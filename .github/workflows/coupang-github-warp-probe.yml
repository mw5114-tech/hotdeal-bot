name: Coupang GitHub-only Cloudflare WARP access trial
on:
  pull_request:
    paths:
      - .github/workflows/coupang-github-warp-probe.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coupang-github-warp-trial
  cancel-in-progress: false
jobs:
  cloudflare-warp-onepass:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Cloudflare WARP from signed repository
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 https://pkg.cloudflareclient.com/pubkey.gpg |
            sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" |
            sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y cloudflare-warp
          sudo systemctl start warp-svc
          warp-cli --version
      - name: Connect WARP on GitHub runner (no user device or secrets)
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s warp-cli --accept-tos registration new
          timeout 30s warp-cli --accept-tos mode warp+doh
          timeout 50s warp-cli --accept-tos connect
          echo "WARP_CONNECT_CALLED"
          verified=0
          for n in 1 2 3 4 5; do
            trace=$(curl --connect-timeout 8 --max-time 12 -fsS https://www.cloudflare.com/cdn-cgi/trace || true)
            if grep -q '^warp=on$' <<< "$trace"; then
              echo "WARP_EGRESS_VERIFIED"
              verified=1
              break
            fi
            echo "WARP_NOT_VERIFIED_${n}"
            sleep 3
          done
          test "$verified" -eq 1
      - name: Install real Chromium (after tunnel connects)
        run: |
          python -m pip install --disable-pip-version-check playwright==1.64.1
          python -m playwright install chromium
          python -m playwright install-deps chromium
      - name: Request Coupang homepage one time from Python and Chromium through WARP
        run: python coupang_github_network_probe.py --channel chromium
      - name: Fail if site access still returns 403 or another blocked response
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("coupang-github-transport-report.json").read_text(encoding="utf-8"))
          browser = r.get("browser_http", {})
          python_http = r.get("python_http", {})
          status = browser.get("main_status")
          ok = (browser.get("result") == "BROWSER_RESPONSE"
                and isinstance(status, int) and 200 <= status < 300
                and browser.get("final_host") == "partners.coupang.com"
                and not browser.get("signals", {}).get("deny_or_challenge_marker", False))
          print("WARP_PARTNERS_PUBLIC_PAGE_OK" if ok else "WARP_PARTNERS_ACCESS_BLOCKED")
          print("Python status:", python_http.get("status"))
          print("Chromium status:", status)
          raise SystemExit(0 if ok else 1)
          PY
      - name: Save only sanitized response data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupang-github-warp-onepass
          path: coupang-github-transport-report.json
          retention-days: 2
          if-no-files-found: ignore
      - name: Disconnect temporary WARP route
        if: always()
        shell: bash
        run: timeout 15s warp-cli --accept-tos disconnect || true
